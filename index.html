<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#f5f7fb}button,textarea,select{font:inherit}button{border:0;border-radius:11px;min-height:44px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{max-width:980px;margin:auto;padding:20px 14px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px rgba(15,23,42,.05)}header{margin-bottom:16px}.eyebrow,.step{font-size:11px;color:var(--blue);font-weight:900;letter-spacing:.08em}.brand{font-size:28px;font-weight:900;margin:2px 0}.sub,.hint{color:var(--muted);font-size:13px}.setup{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.field-label{display:block;font-size:13px;font-weight:800;margin:0 0 5px}textarea{width:100%;height:190px;resize:vertical;padding:11px;border:1px solid var(--line);border-radius:11px;line-height:1.5;outline:0}textarea:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px var(--soft)}select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}.settings{display:grid;gap:10px}.setting{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border-radius:0;background:#fff;color:#334155}.seg button.active{background:var(--blue);color:#fff}.primary{width:100%;background:var(--blue);color:#fff;font-size:15px}.ghost{background:#fff;border:1px solid var(--line);color:#334155}.danger{background:var(--redSoft);color:var(--red)}.notice{display:none;padding:10px 11px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.summary{display:flex;gap:5px;flex-wrap:wrap}.pill{background:#f1f5f9;color:#475569;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.toolbar,.actions{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 9px}.toolbar button,.actions button{padding:8px 10px;background:#f1f5f9;color:#334155}.toolbar button.active{background:#e8f0ff;color:var(--blue)}.toolbar .danger{background:var(--redSoft);color:var(--red)}.round-status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid #bfdbfe;border-radius:13px;background:var(--soft);margin-bottom:11px}.round-title{font-size:21px;font-weight:900}.progress{font-size:12px;color:#475569}.confirm{min-width:170px;background:var(--green);color:#fff}.confirm:disabled{opacity:.42;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.match{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.03)}.meta{padding:7px 10px;background:#f8fafc;color:var(--muted);font-size:11px;font-weight:800}.players{padding:8px}.player{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;margin:0 0 7px;background:#f8fafc;border:1px solid #e2e8f0;color:#172033}.player:last-child{margin-bottom:0}.player.selected{background:var(--greenSoft);border-color:#86efac;color:#166534}.name{flex:1;overflow-wrap:anywhere}.gender{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}.check{font-size:11px;font-weight:900;white-space:nowrap}.bye{padding:11px;background:#fafafa}.byeName{font-size:16px;font-weight:900}.byeNote{font-size:12px;color:var(--green);font-weight:800}.emptyMatch{opacity:.72}.emptySlot{min-height:38px;display:flex;align-items:center;justify-content:center;padding:8px 10px;background:#fafafa;color:#94a3b8;font-size:12px;font-weight:800}.bracket-shell{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fbfcfe}.bracket-scroll{overflow-x:auto;overflow-y:hidden;padding:12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.bracket{display:flex;gap:28px;align-items:stretch;min-width:max-content}.round{width:190px;flex:0 0 190px;display:flex;flex-direction:column}.roundLabel{text-align:center;font-size:12px;font-weight:900;color:#475569;margin-bottom:8px}.roundTrack{position:relative;flex:1;min-height:420px;display:flex;align-items:stretch;justify-content:space-around;flex-direction:column;gap:10px;padding:0 2px}.roundMatchWrap{position:relative;display:flex;align-items:center;min-height:76px}.round-match{width:100%}.roundMatchWrap.connect-right::after{content:"";position:absolute;right:-29px;top:50%;width:29px;border-top:1px solid #cbd5e1}.roundMatchWrap.connect-right::before{content:"";position:absolute;right:-29px;top:25%;height:50%;border-right:1px solid #cbd5e1}.roundMatchWrap.connect-left::after{content:"";position:absolute;left:-29px;top:50%;width:29px;border-top:1px solid #cbd5e1}.roundMatchWrap.connect-left::before{content:"";position:absolute;left:-29px;top:25%;height:50%;border-left:1px solid #cbd5e1}.round-match .meta{font-size:10px;padding:5px 8px}.round-match .players{padding:6px}.round-match .player{padding:8px 9px;margin:0 0 5px;font-size:13px;min-height:38px}.round-match .bye{padding:8px}.round-match .byeName{font-size:14px}.result{display:flex;justify-content:space-between;gap:7px;padding:6px 0;border-top:1px solid #e5e7eb;font-size:12px}.result:first-of-type{border-top:0}.result span:last-child{font-weight:800;text-align:right}.history{display:grid;gap:7px}.historyRound{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.historyTitle{font-size:12px;font-weight:900;margin-bottom:5px}.champion{margin-top:10px;padding:16px;border:2px solid #93c5fd;border-radius:13px;background:var(--soft);text-align:center}.championName{font-size:26px;font-weight:900}.final-bracket{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.final-bracket h3{margin:0 0 8px;font-size:15px}.final-note{font-size:12px;color:var(--muted);margin-bottom:9px}.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:900px){.app{padding:15px 11px 34px}.setup{grid-template-columns:1fr}.head{display:block}.summary{margin-top:7px}.round-status{align-items:stretch;flex-direction:column}.confirm{width:100%}.grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.actions{margin-top:9px}.round{width:178px;flex-basis:178px}.bracket{gap:24px}.roundMatchWrap.connect-right::after,.roundMatchWrap.connect-left::after{width:24px}.roundMatchWrap.connect-right::after{right:-24px}.roundMatchWrap.connect-left::after{left:-24px}.roundMatchWrap.connect-right::before{right:-24px}.roundMatchWrap.connect-left::before{left:-24px}}
@media(max-width:720px){.app{padding:14px 9px 30px}.card{border-radius:14px;padding:12px}.brand{font-size:25px}.round-title{font-size:20px}.grid{grid-template-columns:1fr}.toolbar button,.actions button{flex:1}.round{width:166px;flex-basis:166px}.roundLabel{font-size:11px}.roundTrack{min-height:360px}.round-match .player{font-size:12px;padding:7px 8px}.bracket{gap:20px}.roundMatchWrap.connect-right::after,.roundMatchWrap.connect-left::after{width:20px}.roundMatchWrap.connect-right::after{right:-20px}.roundMatchWrap.connect-left::after{left:-20px}.roundMatchWrap.connect-right::before{right:-20px}.roundMatchWrap.connect-left::before{left:-20px}.final-note{font-size:11px}}
@media(pointer:coarse) and (min-width:721px){.app{max-width:1050px;padding:16px 12px 34px}.card{padding:13px;margin-bottom:10px}.brand{font-size:26px}.sub,.hint{font-size:12px}.setup{gap:12px}.setting{padding:10px}.toolbar,.actions{margin:9px 0 7px}.bracket-scroll{padding:10px}.bracket{gap:22px}.round{width:174px;flex-basis:174px}.roundTrack{min-height:390px}.round-match .player{font-size:12px;padding:7px 8px}}
@media print{body{background:#fff}.app{max-width:none;padding:0}.setup,.toolbar,.actions,#tournamentCard{display:none!important}.card{border:0;box-shadow:none;margin:0;padding:0}.historyRound{break-inside:avoid}.final-bracket{break-inside:avoid}.bracket-shell{border:0;overflow:visible}.bracket-scroll{overflow:visible;padding:0}.bracket{gap:12px}.round{width:160px;flex-basis:160px}.roundTrack{min-height:340px}.round-match .player{font-size:11px;padding:6px}.roundMatchWrap.connect-right::after{right:-12px;width:12px}.roundMatchWrap.connect-right::before{right:-12px}.roundMatchWrap.connect-left::after{left:-12px;width:12px}.roundMatchWrap.connect-left::before{left:-12px}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">SCHOOL EVENT / RANDOM PICKER</div><div class="brand">じゃんけん大会</div><p class="sub">参加者を登録して、勝者を選ぶだけ。大会の進行をかんたんに管理できます。</p></header>
<section class="card"><div class="setup">
<div><div class="step">STEP 1</div><h2>参加者を登録</h2><label class="field-label" for="participants">名前と性別を1行ずつ入力</label><textarea id="participants" placeholder="田中 男子&#10;佐藤 女子&#10;鈴木 男子&#10;山田 女子"></textarea><p class="hint">例：田中 男子 ／ 佐藤 女子（半角・全角スペースどちらでもOK）</p></div>
<div class="settings"><div><div class="step">STEP 2</div><h2>対戦方法</h2><div class="setting"><label class="field-label" for="shuffleMode">組み方</label><select id="shuffleMode"><option value="random">ランダム</option><option value="input">入力順を維持</option><option value="mixedGender">男女をできるだけ混ぜる</option></select></div></div>
<div class="setting"><label class="field-label">表示方法</label><div class="seg"><button id="bracketBtn" type="button">トーナメント</button><button id="cardsBtn" class="active" type="button">試合カード</button></div></div>
<div><div class="step">STEP 3</div><button id="startBtn" class="primary" type="button">大会を開始</button><button id="clearBtn" class="ghost" type="button" style="width:100%;margin-top:6px">入力をクリア</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div>
</div></div></section>
<section class="card" id="tournamentCard" hidden><div class="head"><div><div class="step">大会進行</div><h2 style="margin:0">現在の試合</h2></div><div id="summary" class="summary"></div></div><div class="toolbar"><button id="viewBracket" type="button">トーナメント</button><button id="viewCards" class="active" type="button">試合カード</button><button id="resetTournament" class="danger" type="button">最初から</button></div><div id="tournamentView"></div></section>
<section class="card" id="historyCard" hidden><div class="head"><div><div class="step">記録</div><h2 style="margin:0">対戦結果</h2></div><div class="actions"><button id="copyBtn" class="ghost" type="button">結果をコピー</button><button id="printBtn" class="ghost" type="button">印刷</button></div></div><div id="history" class="history"></div><div id="championArea"></div></section>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const participants=$('participants'),notice=$('notice');
const STATE_KEY='randomPickerTournamentV4',INPUT_KEY='randomPickerParticipantsV4';
let tournament=null,mode='cards';
const showNotice=text=>{notice.textContent=text||'';notice.style.display=text?'block':'none'};
const uid=()=>globalThis.crypto&&typeof crypto.randomUUID==='function'?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeGender(v){v=String(v).trim();if(['男子','男','M','m'].includes(v))return'男子';if(['女子','女','F','f'].includes(v))return'女子';return''}
function parsePlayers(){const lines=participants.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length<2)throw Error('2人以上の参加者を入力してください。');const seen=new Set();return lines.map(line=>{const p=line.split(/\s+/).filter(Boolean);if(p.length<2)throw Error(`名前と性別をスペースで区切ってください：「${line}」`);const g=normalizeGender(p.at(-1)),name=p.slice(0,-1).join(' ');if(!g||!name)throw Error(`名前と性別を確認してください：「${line}」`);const key=name.normalize('NFKC');if(seen.has(key))throw Error(`同じ名前が複数あります：「${name}」`);seen.add(key);return{id:uid(),name,gender:g}})}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function order(players){const m=$('shuffleMode').value;if(m==='input')return[...players];if(m==='random')return shuffle(players);const men=shuffle(players.filter(p=>p.gender==='男子')),women=shuffle(players.filter(p=>p.gender==='女子')),out=[];while(men.length||women.length){if(men.length&&women.length)out.push(men.shift(),women.shift());else out.push(men.shift()||women.shift())}return out}
function nextPow2(n){let s=1;while(s<n)s*=2;return s}
function roundName(i,total){const r=total-i;if(r===1)return'決勝';if(r===2)return'準決勝';if(r===3)return'準々決勝';return`第${i+1}回戦`}
function match(a=null,b=null){const bye=!a||!b;return{a,b,winner:bye?(a||b):null,bye}}
function makeTournament(players){const size=nextPow2(players.length),total=Math.log2(size),slots=players.map(p=>p.id);while(slots.length<size)slots.push(null);const rounds=Array.from({length:total},(_,i)=>({name:roundName(i,total),matches:[]}));for(let r=0;r<total;r++){const matchCount=size/2**(r+1);for(let i=0;i<matchCount;i++)rounds[r].matches.push(r===0?match(slots[i*2],slots[i*2+1]):match())}return{version:4,players,rounds,currentRound:0,champion:null,status:'active'}}
function getPlayer(id){return id&&tournament?tournament.players.find(p=>p.id===id)||null:null}
function real(m){return!!m.a&&!!m.b}
function valid(m){return!!m.winner&&(m.winner===m.a||m.winner===m.b)}
function activeMatches(round){return(round?.matches||[]).filter(m=>m.a||m.b)}
function save(){try{if(tournament)localStorage.setItem(STATE_KEY,JSON.stringify(tournament));else localStorage.removeItem(STATE_KEY)}catch{}}
function load(){try{const raw=localStorage.getItem(STATE_KEY);if(!raw)return null;const s=JSON.parse(raw);if(!s||s.version!==4||!Array.isArray(s.players)||!Array.isArray(s.rounds))return null;const ids=new Set(s.players.map(p=>p.id));s.rounds.forEach(r=>(r.matches||[]).forEach(m=>{m.a=ids.has(m.a)?m.a:null;m.b=ids.has(m.b)?m.b:null;m.bye=!!m.bye||!m.a||!m.b;if(m.bye)m.winner=m.a||m.b||null;else if(!valid(m))m.winner=null}));if(!Number.isInteger(s.currentRound)||s.currentRound<0||s.currentRound>=s.rounds.length)s.currentRound=0;s.champion=s.champion&&ids.has(s.champion)?s.champion:null;s.status=s.champion?'finished':'active';return s}catch{return null}}
function setMode(next){mode=next==='bracket'?'bracket':'cards';$('bracketBtn').classList.toggle('active',mode==='bracket');$('cardsBtn').classList.toggle('active',mode==='cards');$('viewBracket').classList.toggle('active',mode==='bracket');$('viewCards').classList.toggle('active',mode==='cards');if(tournament)render()}
function start(){try{tournament=makeTournament(order(parsePlayers()));save();showTournament()}catch(e){showNotice(e instanceof Error?e.message:'入力を確認してください。')}}
function showTournament(){showNotice('');$('tournamentCard').hidden=false;$('historyCard').hidden=false;render();$('tournamentCard').scrollIntoView({behavior:'smooth',block:'start'})}
function reset(){if(!tournament)return;if(!confirm('大会を最初からやり直しますか？現在の大会結果を削除します。'))return;tournament=null;save();$('tournamentCard').hidden=true;$('historyCard').hidden=true;$('tournamentView').innerHTML='';$('history').innerHTML='';$('championArea').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function playerHtml(m,r,i,interactive,showEmpty=false,compact=false){const a=getPlayer(m.a),b=getPlayer(m.b);const label=`${esc(tournament.rounds[r].name)} ・ 試合 ${i+1}`;if(!a&&!b)return showEmpty?`<div class="match emptyMatch"><div class="meta">${label}</div><div class="emptySlot">対戦者待ち</div></div>`:'';if(!real(m)){const p=a||b;return`<div class="match ${compact?'round-match':''}"><div class="meta">${label}</div><div class="bye"><div class="byeName">${esc(p.name)}</div><div class="gender">${esc(p.gender)}</div><div class="byeNote">不戦勝・自動確定</div></div></div>`}const row=(side,p)=>interactive?`<button type="button" class="player ${m.winner===p.id?'selected':''}" data-r="${r}" data-i="${i}" data-side="${side}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">選択中</span>':''}</button>`:`<div class="player ${m.winner===p.id?'selected':''}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">勝</span>':''}</div>`;return`<div class="match ${compact?'round-match':''}"><div class="meta">${label}</div><div class="players">${row('a',a)}${row('b',b)}</div></div>`}
function renderCards(){const r=tournament.currentRound,round=tournament.rounds[r];return`<div class="grid">${round.matches.map((m,i)=>playerHtml(m,r,i,tournament.status!=='finished')).join('')}</div>`}
function renderBracket(){const firstCount=activeMatches(tournament.rounds[0]).length||1;const roundsHtml=tournament.rounds.map((round,r)=>{const matches=round.matches.filter(m=>m.a||m.b);if(!matches.length)return'';return`<div class="round"><div class="roundLabel">${esc(round.name)}</div><div class="roundTrack" data-round="${r}">${matches.map((m)=>{const i=round.matches.indexOf(m);const left=r>0?' connect-left':'';const right=r<tournament.rounds.length-1?' connect-right':'';return`<div class="roundMatchWrap${left}${right}">${playerHtml(m,r,i,false,false,true)}</div>`}).join('')}</div></div>`}).join('');return`<div class="bracket-shell"><div class="bracket-scroll"><div class="bracket" style="--first-count:${firstCount}">${roundsHtml}</div></div></div>`}
function choose(r,i,side){if(!tournament||tournament.status==='finished'||r!==tournament.currentRound)return;const m=tournament.rounds[r]?.matches?.[i];if(!m||!real(m))return;const id=side==='a'?m.a:m.b;if(!id)return;m.winner=m.winner===id?null:id;showNotice('');save();render()}
function confirmRound(){if(!tournament||tournament.status==='finished')return;const round=tournament.rounds[tournament.currentRound],matches=activeMatches(round);if(!matches.length){showNotice('確定できる試合がありません。');return}if(!matches.every(valid)){showNotice('まだ勝者が未入力の試合があります。勝者を選択してください。');return}const winners=matches.map(m=>m.winner);if(winners.length===1){tournament.champion=winners[0];tournament.status='finished';save();render();return}const next=tournament.rounds[tournament.currentRound+1];if(!next){showNotice('次のラウンドを作成できませんでした。');return}next.matches=next.matches.map((m,i)=>i<Math.ceil(winners.length/2)?match(winners[i*2],winners[i*2+1]||null):match());tournament.currentRound++;save();render();$('tournamentCard').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){if(!tournament)return;const round=tournament.rounds[tournament.currentRound];if(!round){tournament=null;save();return}const matches=activeMatches(round),resolved=matches.filter(valid).length,finished=tournament.status==='finished'&&!!tournament.champion,ready=!finished&&matches.length>0&&resolved===matches.length;$('summary').innerHTML=`<span class="pill">${tournament.players.length}人</span><span class="pill">${finished?'終了':esc(round.name)}</span>`;const body=mode==='cards'?renderCards():renderBracket();const finishedBracket=finished?`<div class="final-bracket"><h3>最終トーナメント表</h3><div class="final-note">各ラウンドの勝ち上がり結果を一覧で確認できます。</div>${renderBracket()}</div>`:'';$('tournamentView').innerHTML=`<div class="round-status"><div><div class="step">${finished?'大会結果':'現在のラウンド'}</div><div class="round-title">${finished?'大会終了':esc(round.name)}</div>${finished?'':`<div class="progress">${resolved} / ${matches.length} 試合の勝者を選択済み</div>`}</div>${finished?'':`<button id="confirmRound" class="confirm" type="button" ${ready?'':'disabled'}>${esc(round.name)}を確定</button>`}</div>${body}${finishedBracket}`;$('confirmRound')?.addEventListener('click',confirmRound);$('tournamentView').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.r),Number(b.dataset.i),b.dataset.side)));renderHistory();save()}
function renderHistory(){$('history').innerHTML=tournament.rounds.map(r=>{const rows=r.matches.filter(m=>m.a||m.b).map(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);if(!a&&!b)return'';const matchup=a?`${esc(a.name)}${b?` vs ${esc(b.name)}`:' vs 不戦勝'}`:`不戦勝 ${esc(b.name)}`;return`<div class="result"><span>${matchup}</span><span>${w?`勝者：${esc(w.name)}`:'未確定'}</span></div>`}).join('');return`<div class="historyRound"><div class="historyTitle">${esc(r.name)}</div>${rows||'<div class="empty">まだ記録なし</div>'}</div>`}).join('');const c=getPlayer(tournament.champion);$('championArea').innerHTML=c?`<div class="champion"><div class="step">大会結果</div><div class="championName">${esc(c.name)}</div><div class="gender">${esc(c.gender)}</div></div>`:''}
async function copyResults(){if(!tournament)return;const out=['じゃんけん大会 対戦結果',''];tournament.rounds.forEach(r=>{out.push(r.name);r.matches.filter(m=>m.a||m.b).forEach(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);if(!a&&!b)return;out.push(`・${a?a.name:'不戦勝'}${b?` vs ${b.name}`:''} → ${w?`勝者：${w.name}`:'未確定'}`)});out.push('')});if(tournament.champion)out.push(`優勝：${getPlayer(tournament.champion).name}`);const text=out.join('\n');try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else throw Error('clipboard unavailable');showNotice('結果をコピーしました。')}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();showNotice(ok?'結果をコピーしました。':'コピーできませんでした。端末のコピー機能をご利用ください。')}}
$('bracketBtn').addEventListener('click',()=>setMode('bracket'));$('cardsBtn').addEventListener('click',()=>setMode('cards'));$('viewBracket').addEventListener('click',()=>setMode('bracket'));$('viewCards').addEventListener('click',()=>setMode('cards'));$('startBtn').addEventListener('click',start);$('clearBtn').addEventListener('click',()=>{participants.value='';try{localStorage.removeItem(INPUT_KEY)}catch{}showNotice('');participants.focus()});$('resetTournament').addEventListener('click',reset);$('copyBtn').addEventListener('click',copyResults);$('printBtn').addEventListener('click',()=>window.print());participants.addEventListener('input',()=>{try{localStorage.setItem(INPUT_KEY,participants.value)}catch{}});
try{const saved=localStorage.getItem(INPUT_KEY);if(saved)participants.value=saved}catch{};
tournament=load();if(tournament)showTournament();
})();
</script>
