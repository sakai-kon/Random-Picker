<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><title>じゃんけん大会 運営ツール</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6;--p:#111827;--line:#d1d5db;--muted:#6b7280;--soft:#f9fafb;--ok:#166534;--okbg:#dcfce7;--danger:#991b1b;--dangerbg:#fee2e2;--warn:#92400e;--warnbg:#fffbeb}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overscroll-behavior-y:none}.app{max-width:1080px;margin:auto;padding:18px 14px calc(40px + env(safe-area-inset-bottom))}header{margin-bottom:12px}h1{font-size:24px;margin:0;letter-spacing:-.03em}header p{margin:3px 0 0;color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}textarea,input,select{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{height:210px;resize:vertical;padding:10px;line-height:1.45}input,select{padding:11px 12px;min-height:44px}.hint,.small{font-size:12px;color:var(--muted)}.hint{margin:5px 0 0}.settings{display:grid;gap:10px;align-content:start}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:#fff;color:#374151;padding:10px 8px;font-size:13px;min-height:44px}.seg button.active{background:var(--p);color:#fff}.actions,.toolbar,.results-actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 14px;min-height:44px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;background:var(--p);color:#fff;touch-action:manipulation}button.secondary{background:#e5e7eb;color:#111827}button.ghost{background:#fff;color:#111827;border:1px solid var(--line)}button.danger{background:var(--dangerbg);color:var(--danger)}button.success{background:var(--ok);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}.notice{display:none;padding:10px 12px;border-radius:10px;background:var(--warnbg);border:1px solid #fde68a;color:var(--warn);font-size:13px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section-head h2{font-size:17px;margin:0}.summary{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:11px;font-weight:800;background:#f3f4f6;border-radius:999px;padding:5px 8px}.round-status{position:sticky;top:8px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(249,250,251,.96);backdrop-filter:blur(8px);margin-bottom:10px}.round-status strong{font-size:14px}.progress{font-size:12px;color:var(--muted);margin-top:2px}.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:11px;background:var(--soft);padding:10px}.bracket{display:flex;gap:32px;min-width:max-content;align-items:stretch}.round-col{width:220px;display:flex;flex-direction:column}.round-title{text-align:center;font-weight:800;font-size:12px;margin-bottom:8px}.matches{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}.match-wrap{position:relative;display:flex;align-items:center}.match{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;position:relative;z-index:2}.match-row{display:flex;align-items:center;gap:6px;min-height:38px;padding:6px 8px;border-bottom:1px solid #eef0f2}.match-row:last-child{border-bottom:0}.player-name{flex:1;min-width:0;word-break:break-word;font-size:13px}.gender-tag,.winner-tag{font-size:10px;padding:3px 6px;border-radius:999px;white-space:nowrap;font-weight:800;background:#f3f4f6;color:#4b5563}.winner-tag{background:var(--okbg);color:var(--ok)}.bye-label{font-style:italic}.match-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;background:var(--soft);border-top:1px solid var(--line)}.match-actions button{font-size:11px;padding:7px 5px;min-height:42px}.match-actions button.selected{background:var(--ok)}.match.bye{border-style:dashed}.connector-right{position:absolute;right:-32px;top:25%;bottom:25%;width:32px;pointer-events:none;z-index:1}.connector-right:before{content:"";position:absolute;right:0;top:0;bottom:0;border-right:1px solid #9ca3af}.connector-right:after{content:"";position:absolute;right:0;top:50%;width:32px;border-top:1px solid #9ca3af}.cards-view{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}.round-section{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:9px}.round-section h3{font-size:13px;margin:0 0 7px}.history{display:grid;gap:7px}.history-round{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--soft)}.history-round strong{font-size:12px}.result-row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}.result-row:first-child{border-top:0;margin-top:5px}.champion{text-align:center;border:1px solid #111827;border-radius:11px;padding:14px;margin-top:10px}.champion-title{font-size:11px;color:var(--muted);font-weight:800}.champion-name{font-size:24px;font-weight:900}.champion-gender{font-size:10px;color:var(--muted)}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:600px){.app{padding:14px 10px calc(30px + env(safe-area-inset-bottom))}.round-status{align-items:flex-start;flex-direction:column;top:4px}.round-status button{width:100%}.bracket{gap:26px}.round-col{width:205px}.connector-right{right:-26px;width:26px}.connector-right:after{width:26px}.cards-view{grid-template-columns:1fr}.results-actions button{flex:1}}@media(hover:hover){button:not(:disabled):hover{filter:brightness(.96)}}@media print{.setup-card,.toolbar,.round-status,.results-actions,header p{display:none!important}.app{max-width:none;padding:0}.card{border:0;box-shadow:none;padding:0}.table-wrap{border:0;padding:0}.match-actions,.connector-right{display:none}}</style></head><body><div class="app"><header><h1>じゃんけん大会 運営ツール</h1><p>全員で一斉にじゃんけんして、ラウンドごとに結果をまとめて確定。</p></header><section class="card setup-card"><div class="section-head"><h2>参加者登録</h2><span class="small">名前と性別を1行ずつ</span></div><div class="grid"><div><label for="participants">参加者</label><textarea id="participants" placeholder="田中 男子
佐藤 女子
鈴木 男子
山田 女子"></textarea><p class="hint">半角・全角スペースのどちらでも区切れます。</p></div><div class="settings"><div><label for="shuffleMode">対戦の組み方</label><select id="shuffleMode"><option value="random">ランダム</option><option value="input">入力順を維持</option><option value="mixedGender">男女をできるだけ混ぜる</option></select></div><div><label>表示</label><div class="seg"><button id="bracketBtn" class="active" type="button">トーナメント</button><button id="cardsBtn" type="button">カード</button></div></div><div class="actions"><button id="startBtn" type="button">大会を開始</button><button id="clearBtn" class="secondary" type="button">入力をクリア</button></div><div id="notice" class="notice" role="status"></div></div></div></section><section class="card" id="tournamentCard" style="display:none"><div class="section-head"><h2>大会運営</h2><div id="summary" class="summary"></div></div><div class="toolbar" style="margin-bottom:9px"><button id="viewBracket" class="active" type="button">トーナメント</button><button id="viewCards" class="secondary" type="button">カード</button><button id="resetTournament" class="danger" type="button">最初から</button></div><div id="tournamentView"></div></section><section class="card" id="historyCard" style="display:none"><div class="section-head"><h2>対戦結果</h2><div class="results-actions"><button id="copyBtn" class="secondary" type="button">結果をコピー</button><button id="printBtn" class="ghost" type="button">印刷</button></div></div><div id="history" class="history"></div><div id="championArea"></div></section></div><script>
const $=id=>document.getElementById(id),participants=$("participants"),notice=$("notice");
const STORAGE_KEY="randomPickerTournamentV3",PARTICIPANTS_KEY="randomPickerParticipantsV3";
let tournament=null,displayMode="bracket";
const LEGACY_KEYS=["jankenTournamentState","jankenTournamentStateV2","jankenParticipantsV2"];for(const key of LEGACY_KEYS)localStorage.removeItem(key);
const savedParticipants=localStorage.getItem(PARTICIPANTS_KEY);if(savedParticipants)participants.value=savedParticipants;participants.addEventListener("input",()=>localStorage.setItem(PARTICIPANTS_KEY,participants.value));
$("bracketBtn").onclick=()=>setMode("bracket");$("cardsBtn").onclick=()=>setMode("cards");$("viewBracket").onclick=()=>setMode("bracket");$("viewCards").onclick=()=>setMode("cards");$("startBtn").onclick=startTournament;$("clearBtn").onclick=()=>{participants.value="";localStorage.removeItem(PARTICIPANTS_KEY);showNotice("");participants.focus()};$("resetTournament").onclick=resetTournament;$("copyBtn").onclick=copyResults;$("printBtn").onclick=()=>window.print();
function setMode(mode){displayMode=mode;$("bracketBtn").classList.toggle("active",mode==="bracket");$("cardsBtn").classList.toggle("active",mode==="cards");$("viewBracket").classList.toggle("active",mode==="bracket");$("viewBracket").classList.toggle("secondary",mode!=="bracket");$("viewCards").classList.toggle("active",mode==="cards");$("viewCards").classList.toggle("secondary",mode!=="cards");if(tournament)render()}function showNotice(text){notice.textContent=text;notice.style.display=text?"block":"none"}function uid(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`}function gender(value){if(["男子","男","M","m"].includes(value))return"男子";if(["女子","女","F","f"].includes(value))return"女子";return""}
function parseParticipants(){const lines=participants.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(lines.length<2)throw Error("2人以上の参加者を入力してください。");const seen=new Set(),players=[];for(const line of lines){const parts=line.split(/\s+/).filter(Boolean);if(parts.length<2)throw Error(`名前と性別をスペースで区切ってください：「${line}」`);const g=gender(parts.at(-1)),name=parts.slice(0,-1).join(" ");if(!g||!name)throw Error(`名前と性別を確認してください：「${line}」`);const key=name.normalize("NFKC");if(seen.has(key))throw Error(`同じ名前が複数あります：「${name}」`);seen.add(key);players.push({id:uid(),name,gender:g})}return players}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function orderPlayers(players){const mode=$("shuffleMode").value;if(mode==="random")return shuffle(players);if(mode==="input")return[...players];let men=shuffle(players.filter(p=>p.gender==="男子")),women=shuffle(players.filter(p=>p.gender==="女子")),out=[];while(men.length||women.length){if(men.length&&women.length)out.push(men.shift(),women.shift());else out.push(men.shift()||women.shift())}return out}
function nextPowerOfTwo(n){let size=1;while(size<n)size*=2;return size}function roundName(index,total){const remaining=total-index;if(remaining===1)return"決勝";if(remaining===2)return"準決勝";if(remaining===3)return"準々決勝";return`第${index+1}回戦`}function makeMatch(aId=null,bId=null){const bye=!aId||!bId;return{a:aId,b:bId,winner:bye?(aId||bId):null,bye}}function makeTournament(players){const size=nextPowerOfTwo(players.length),roundCount=Math.log2(size),slots=[...players.map(p=>p.id)];while(slots.length<size)slots.push(null);const rounds=Array.from({length:roundCount},(_,index)=>({name:roundName(index,roundCount),matches:[]}));for(let i=0;i<size;i+=2)rounds[0].matches.push(makeMatch(slots[i],slots[i+1]));return{version:3,players,rounds,currentRound:0,champion:null,status:"active"}}
function player(id){return id?tournament.players.find(p=>p.id===id)||null:null}function isRealMatch(match){return!!match.a&&!!match.b}function isBye(match){return!!match.bye}function validWinner(match){return!!match.winner&&(match.winner===match.a||match.winner===match.b)}function isResolved(match){return!isRealMatch(match)||validWinner(match)}
function sanitizeTournament(state){if(!state||state.version!==3||!Array.isArray(state.players)||!Array.isArray(state.rounds))return null;const ids=new Set(state.players.map(p=>p.id));state.rounds.forEach(round=>{if(!Array.isArray(round.matches))round.matches=[];round.matches.forEach(match=>{match.a=ids.has(match.a)?match.a:null;match.b=ids.has(match.b)?match.b:null;match.bye=!!match.bye||!match.a||!match.b;if(match.bye)match.winner=match.a||match.b||null;else if(!validWinner(match))match.winner=null})});if(!Number.isInteger(state.currentRound)||state.currentRound<0||state.currentRound>=state.rounds.length)state.currentRound=0;if(state.champion&&!ids.has(state.champion))state.champion=null;state.status=state.champion?"finished":"active";return state}
function save(){if(tournament)localStorage.setItem(STORAGE_KEY,JSON.stringify(tournament))}function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;const parsed=sanitizeTournament(JSON.parse(raw));if(!parsed){localStorage.removeItem(STORAGE_KEY);return null}return parsed}catch{localStorage.removeItem(STORAGE_KEY);return null}}
function startTournament(){try{tournament=makeTournament(orderPlayers(parseParticipants()));save();showTournament()}catch(error){showNotice(error.message)}}function showTournament(){showNotice("");$("tournamentCard").style.display="block";$("historyCard").style.display="block";render();window.scrollTo({top:$("tournamentCard").offsetTop-8,behavior:"smooth"})}function resetTournament(){if(!tournament)return;if(!window.confirm("大会を最初からやり直しますか？現在の大会結果を削除します。"))return;tournament=null;localStorage.removeItem(STORAGE_KEY);$("tournamentCard").style.display="none";$("historyCard").style.display="none";$("history").innerHTML="";$("championArea").innerHTML="";window.scrollTo({top:0,behavior:"smooth"})}
function getCurrentRound(){return tournament?.rounds?.[tournament.currentRound]||null}function render(){if(!tournament)return;const round=getCurrentRound();if(!round){tournament=null;localStorage.removeItem(STORAGE_KEY);$("tournamentCard").style.display="none";$("historyCard").style.display="none";return}const realMatches=round.matches.filter(isRealMatch),resolved=realMatches.filter(isResolved).length,total=realMatches.length,finished=tournament.status==="finished"&&!!tournament.champion;$("summary").innerHTML=`<span class="pill">${tournament.players.length}人</span><span class="pill">${finished?"大会終了":round.name}</span>`;const ready=!finished&&total>0&&resolved===total;const statusText=finished?"大会終了":`${round.name}　${resolved}/${total}試合確定`;const statusHtml=`<div class="round-status"><div><strong>${statusText}</strong>${!finished?'<div class="progress">不戦勝は自動的に確定済みです。</div>':''}</div>${finished?"":`<button class="success" type="button" ${ready?"":"disabled"} data-action="confirm">${esc(round.name)}を確定</button>`}</div>`;$("tournamentView").innerHTML=statusHtml+(displayMode==="bracket"?renderBracket():renderCards());$("tournamentView").querySelector('[data-action="confirm"]')?.addEventListener("click",confirmCurrentRound);$("tournamentView").querySelectorAll("[data-match-index]").forEach(button=>button.addEventListener("click",()=>chooseWinner(Number(button.dataset.round),Number(button.dataset.matchIndex),button.dataset.side)));renderHistory();save()}
function matchRowHtml(p,won){return p?`<div class="match-row"><span class="player-name">${esc(p.name)}</span><span class="gender-tag">${p.gender}</span>${won?'<span class="winner-tag">勝</span>':''}</div>`:`<div class="match-row"><span class="player-name small bye-label">不戦勝</span></div>`}function matchActionsHtml(match,r,index,a,b){if(r!==tournament.currentRound||tournament.status==="finished"||!isRealMatch(match))return"";return`<div class="match-actions"><button type="button" data-match-index="${index}" data-round="${r}" data-side="a" class="${match.winner===match.a?'selected':''}">${esc(a.name)}</button><button type="button" data-match-index="${index}" data-round="${r}" data-side="b" class="${match.winner===match.b?'selected':''}">${esc(b.name)}</button></div>`}function matchHtml(match,r,index){const a=player(match.a),b=player(match.b);return`<div class="match-wrap"><div class="match ${isBye(match)?'bye':''}">${matchRowHtml(a,match.winner===match.a)}${matchRowHtml(b,match.winner===match.b)}${matchActionsHtml(match,r,index,a,b)}</div>${r<tournament.rounds.length-1?'<span class="connector-right"></span>':''}</div>`}
function renderBracket(){return`<div class="table-wrap"><div class="bracket">${tournament.rounds.map((round,r)=>`<div class="round-col"><div class="round-title">${esc(round.name)}</div><div class="matches">${round.matches.map((m,i)=>matchHtml(m,r,i)).join("")||'<div class="empty">まだ試合なし</div>'}</div></div>`).join("")}</div></div>`}function renderCards(){return`<div class="cards-view">${tournament.rounds.map((round,r)=>`<div class="round-section"><h3>${esc(round.name)}</h3>${round.matches.map((m,i)=>matchHtml(m,r,i)).join("")||'<div class="empty">まだ試合なし</div>'}</div>`).join("")}</div>`}
function chooseWinner(roundIndex,matchIndex,side){if(!tournament||tournament.status==="finished"||roundIndex!==tournament.currentRound)return;const match=tournament.rounds[roundIndex]?.matches?.[matchIndex];if(!match||!isRealMatch(match))return;const candidate=side==="a"?match.a:match.b;if(!candidate)return;match.winner=match.winner===candidate?null:candidate;save();render()}
function confirmCurrentRound(){if(!tournament||tournament.status==="finished")return;const round=getCurrentRound();if(!round)return;const real=round.matches.filter(isRealMatch);if(!real.length){showNotice("確定できる試合がありません。");return}if(!real.every(validWinner)){showNotice("まだ勝者が未入力の試合があります。勝敗を選択してください。");return}const winners=real.map(m=>m.winner);if(winners.length===1){tournament.champion=winners[0];tournament.status="finished";save();render();return}const next=tournament.rounds[tournament.currentRound+1];if(!next){showNotice("次のラウンドを作成できませんでした。");return}next.matches=[];for(let i=0;i<winners.length;i+=2)next.matches.push(makeMatch(winners[i]||null,winners[i+1]||null));tournament.currentRound+=1;save();render();window.scrollTo({top:$("tournamentCard").offsetTop-8,behavior:"smooth"})}
function renderHistory(){$("history").innerHTML=tournament.rounds.map(round=>`<div class="history-round"><strong>${esc(round.name)}</strong>${round.matches.filter(m=>m.a||m.b).map(match=>{const a=player(match.a),b=player(match.b),w=player(match.winner);const matchup=b?`${esc(a.name)}（${a.gender}） vs ${esc(b.name)}（${b.gender}）`:`${esc(a.name)}（${a.gender}） vs 不戦勝`;return`<div class="result-row"><span>${matchup}</span><span>${w?`勝者：${esc(w.name)}`:"未確定"}</span></div>`}).join("")||'<div class="small">まだ記録なし</div>'}</div>`).join("");const champion=player(tournament.champion);$("championArea").innerHTML=champion?`<div class="champion"><div class="champion-title">大会結果</div><div class="champion-name">${esc(champion.name)}</div><div class="champion-gender">${champion.gender}</div><div class="small" style="margin-top:5px">優勝</div></div>`:""}
async function copyResults(){if(!tournament)return;let text="じゃんけん大会 対戦結果\n\n";for(const round of tournament.rounds){text+=round.name+"\n";for(const match of round.matches.filter(m=>m.a||m.b)){const a=player(match.a),b=player(match.b),w=player(match.winner);text+=`・${a.name}（${a.gender}） vs ${b?b.name+"（"+b.gender+"）":"不戦勝"} → ${w?"勝者："+w.name:"未確定"}\n`}text+="\n"}if(tournament.champion){const p=player(tournament.champion);text+=`優勝：${p.name}（${p.gender}）\n`}try{await navigator.clipboard.writeText(text);showNotice("結果をコピーしました。");notice.scrollIntoView({behavior:"smooth",block:"nearest"})}catch{showNotice("コピーできませんでした。iPadではブラウザの共有・コピー機能をご利用ください。")}}
function esc(value){return String(value??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
tournament=load();if(tournament)showTournament();
</script></body></html>
