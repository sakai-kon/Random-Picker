r-bottom:1px solid var(--line)}.match-players{padding:10px}.player-button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;margin:0 0 8px;background:#f8fafc;border:1px solid #e2e8f0;color:#172033;min-height:58px;font-size:16px}.player-button:last-child{margin-bottom:0}.player-button.selected{background:var(--green-soft);border-color:#86efac;color:#166534}.player-name{flex:1;min-width:0;overflow-wrap:anywhere}.gender{font-size:11px;color:var(--muted);font-weight:800}.check{font-size:12px;font-weight:900}.bye-card{background:#fafafa}.bye-body{padding:14px}.bye-player{font-size:18px;font-weight:900}.bye-note{font-size:12px;color:var(--green);font-weight:800;margin-top:4px}.bracket-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:#fbfcfe;padding:12px}.bracket{display:flex;gap:28px;min-width:max-content}.round-col{width:220px;display:flex;flex-direction:column}.round-label{text-align:center;font-size:12px;font-weight:900;color:#475569;margin-bottom:8px}.matches{display:flex;flex-direction:column;justify-content:space-around;gap:10px;flex:1}.old-match{position:relative}.old-match .match-card{border-radius:12px}.connector{position:absolute;right:-28px;top:25%;bottom:25%;width:28px;pointer-events:none}.connector:before{content:"";position:absolute;right:0;top:0;bottom:0;border-right:1px solid #cbd5e1}.connector:after{content:"";position:absolute;right:0;top:50%;width:28px;border-top:1px solid #cbd5e1}.history-list{display:grid;gap:8px}.history-round{border:1px solid var(--line);border-radius:13px;background:#fbfcfe;padding:12px}.history-round-title{font-size:12px;font-weight:900;margin-bottom:6px}.result-row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #e5e7eb;font-size:12px}.result-row:first-of-type{border-top:0}.result-row span:last-child{font-weight:800;white-space:nowrap}.champion{margin-top:12px;border:2px solid #93c5fd;border-radius:14px;background:var(--blue-soft);text-align:center;padding:18px}.champion-label{font-size:11px;color:var(--blue);font-weight:900}.champion-name{font-size:28px;font-weight:900;margin:2px 0}.empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}.results-actions{display:flex;gap:7px;flex-wrap:wrap}.results-actions button{padding:9px 12px}@media(max-width:720px){.app{padding:17px 11px calc(34px + env(safe-area-inset-bottom))}.brand{font-size:27px}.setup-grid{grid-template-columns:1fr}.tournament-head{display:block}.summary{justify-content:flex-start;margin-top:8px}.round-status{align-items:stretch;flex-direction:column;top:4px}.round-title{font-size:22px}.confirm{width:100%}.current-grid{grid-template-columns:1fr}.toolbar button{flex:1}.results-actions button{flex:1}.bracket{gap:24px}.round-col{width:210px}.connector{right:-24px;width:24px}.connector:after{width:24px}}@media(max-width:430px){.player-button{min-height:62px;font-size:17px}.gender{display:none}.result-row{display:block}.result-row span:last-child{display:block;margin-top:3px}}@media print{header p,.setup-card,.toolbar,.round-status,.results-actions,.notice{display:none!important}.app{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:0}.bracket-wrap{border:0;padding:0}.connector,.match-actions{display:none}}</style></head><body><div class="app"><header><div class="eyebrow">学校行事・大会運営</div><div class="brand">じゃんけん大会</div><p class="sub">参加者を登録して、勝者を選ぶだけ。大会の進行をかんたんに管理できます。</p></header><section class="card setup-card"><div class="setup-grid"><div><div class="step">STEP 1</div><h2>参加者を登録</h2><label class="field-label" for="participants">名前と性別を1行ずつ入力</label><textarea id="participants" placeholder="田中 男子
佐藤 女子
鈴木 男子
山田 女子"></textarea><p class="hint">例：田中 男子　／　佐藤 女子　（半角・全角スペースどちらでもOK）</p></div><div class="settings"><div><div class="step">STEP 2</div><h2>対戦方法</h2><div class="setting"><label class="field-label" for="shuffleMode">組み方</label><select id="shuffleMode"><option value="random">ランダム</option><option value="input">入力順を維持</option><option value="mixedGender">男女をできるだけ混ぜる</option></select></div></div><div class="setting"><label class="field-label">表示方法</label><div class="seg"><button id="bracketBtn" type="button">トーナメント</button><button id="cardsBtn" class="active" type="button">試合カード</button></div></div><div><div class="step">STEP 3</div><button id="startBtn" class="primary" type="button">大会を開始</button><button id="clearBtn" class="ghost" type="button" style="width:100%;margin-top:7px">入力をクリア</button></div><div id="notice" class="notice" role="status"></div></div></div></section><section class="card" id="tournamentCard" style="display:none"><div class="tournament-head"><div><div class="step">大会進行</div><h2 style="margin-bottom:0">現在の試合</h2></div><div id="summary" class="summary"></div></div><div class="toolbar"><button id="viewBracket" type="button">トーナメント</button><button id="viewCards" class="active" type="button">試合カード</button><button id="resetTournament" class="danger" type="button">最初から</button></div><div id="tournamentView"></div></section><section class="card" id="historyCard" style="display:none"><div class="tournament-head"><div><div class="step">記録</div><h2 style="margin-bottom:0">対戦結果</h2></div><div class="results-actions"><button id="copyBtn" class="ghost" type="button">結果をコピー</button><button id="printBtn" class="ghost" type="button">印刷</button></div></div><div id="history" class="history-list"></div><div id="championArea"></div></section></div><script>
const $=id=>document.getElementById(id),participants=$("participants"),notice=$("notice");const STORAGE_KEY="randomPickerTournamentV3",PARTICIPANTS_KEY="randomPickerParticipantsV3";let tournament=null,displayMode="cards";const LEGACY_KEYS=["jankenTournamentState","jankenTournamentStateV2","jankenParticipantsV2"];LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));const savedParticipants=localStorage.getItem(PARTICIPANTS_KEY);if(savedParticipants)participants.value=savedParticipants;participants.addEventListener("input",()=>localStorage.setItem(PARTICIPANTS_KEY,participants.value));$("bracketBtn").onclick=()=>setMode("bracket");$("cardsBtn").onclick=()=>setMode("cards");$("viewBracket").onclick=()=>setMode("bracket");$("viewCards").onclick=()=>setMode("cards");$("startBtn").onclick=startTournament;$("clearBtn").onclick=()=>{participants.value="";localStorage.removeItem(PARTICIPANTS_KEY);showNotice("");participants.focus()};$("resetTournament").onclick=resetTournament;$("copyBtn").onclick=copyResults;$("printBtn").onclick=()=>window.print();function setMode(mode){displayMode=mode;$("bracketBtn").classList.toggle("active",mode==="bracket");$("cardsBtn").classList.toggle("active",mode==="cards");$("viewBracket").classList.toggle("active",mode==="bracket");$("viewCards").classList.toggle("active",mode==="cards");if(tournament)render()}function showNotice(text){notice.textContent=text;notice.style.display=text?"block":"none"}function uid(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}`}function gender(value){if(["男子","男","M","m"].includes(value))return"男子";if(["女子","女","F","f"].includes(value))return"女子";return""}function parseParticipants(){const lines=participants.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(lines.length<2)throw Error("2人以上の参加者を入力してください。");const seen=new Set(),players=[];for(const line of lines){const parts=line.split(/\s+/).filter(Boolean);if(parts.length<2)throw Error(`名前と性別をスペースで区切ってください：「${line}」`);const g=gender(parts.at(-1)),name=parts.slice(0,-1).join(" ");if(!g||!name)throw Error(`名前と性別を確認してください：「${line}」`);const key=name.normalize("NFKC");if(seen.has(key))throw Error(`同じ名前が複数あります：「${name}」`);seen.add(key);players.push({id:uid(),name,gender:g})}return players}function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function orderPlayers(players){const mode=$("shuffleMode").value;if(mode==="random")return shuffle(players);if(mode==="input")return[...players];let men=shuffle(players.filter(p=>p.gender==="男子")),women=shuffle(players.filter(p=>p.gender==="女子")),out=[];while(men.length||women.length){if(men.length&&women.length)out.push(men.shift(),women.shift());else out.push(men.shift()||women.shift())}return out}function nextPowerOfTwo(n){let s=1;while(s<n)s*=2;return s}function roundName(index,total){const r=total-index;if(r===1)return"決勝";if(r===2)return"準決勝";if(r===3)return"準々決勝";return`第${index+1}回戦`}function makeMatch(aId=null,bId=null){const bye=!aId||!bId;return{a:aId,b:bId,winner:bye?(aId||bId):null,bye}}function makeTournament(players){const size=nextPowerOfTwo(players.length),count=Math.log2(size),slots=[...players.map(p=>p.id)];while(slots.length<size)slots.push(null);const rounds=Array.from({length:count},(_,i)=>({name:roundName(i,count),matches:[]}));for(let i=0;i<size;i+=2)rounds[0].matches.push(makeMatch(slots[i],slots[i+1]));return{version:3,players,rounds,currentRound:0,champion:null,status:"active"}}function player(id){return id?tournament.players.find(p=>p.id===id)||null:null}function isRealMatch(m){return!!m.a&&!!m.b}function validWinner(m){return!!m.winner&&(m.winner===m.a||m.winner===m.b)}function sanitizeTournament(state){if(!state||state.version!==3||!Array.isArray(state.players)||!Array.isArray(state.rounds))return null;const ids=new Set(state.players.map(p=>p.id));state.rounds.forEach(r=>{if(!Array.isArray(r.matches))r.matches=[];r.matches.forEach(m=>{m.a=ids.has(m.a)?m.a:null;m.b=ids.has(m.b)?m.b:null;m.bye=!!m.bye||!m.a||!m.b;if(m.bye)m.winner=m.a||m.b||null;else if(!validWinner(m))m.winner=null})});if(!Number.isInteger(state.currentRound)||state.currentRound<0||state.currentRound>=state.rounds.length)state.currentRound=0;if(state.champion&&!ids.has(state.champion))state.champion=null;state.status=state.champion?"finished":"active";return state}function save(){if(tournament)localStorage.setItem(STORAGE_KEY,JSON.stringify(tournament))}function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;const state=sanitizeTournament(JSON.parse(raw));if(!state){localStorage.removeItem(STORAGE_KEY);return null}return state}catch{localStorage.removeItem(STORAGE_KEY);return null}}function startTournament(){try{tournament=makeTournament(orderPlayers(parseParticipants()));save();showTournament()}catch(e){showNotice(e.message)}}function showTournament(){showNotice("");$("tournamentCard").style.display="block";$("historyCard").style.display="block";render();window.scrollTo({top:$("tournamentCard").offsetTop-8,behavior:"smooth"})}function resetTournament(){if(!tournament)return;if(!confirm("大会を最初からやり直しますか？現在の大会結果を削除します。"))return;tournament=null;localStorage.removeItem(STORAGE_KEY);$("tournamentCard").style.display="none";$("historyCard").style.display="none";$("history").innerHTML="";$("championArea").innerHTML="";window.scrollTo({top:0,behavior:"smooth"})}function matchHtml(m,r,i){const a=player(m.a),b=player(m.b),current=r===tournament.currentRound&&!tournament.champion&&tournament.status!=="finished";if(!a&&!b)return"";if(!isRealMatch(m)){const p=a||b;return`<div class="old-match"><article class="match-card bye-card"><div class="match-meta">${esc(tournament.rounds[r].name)} ・ 試合 ${i+1}</div><div class="bye-body"><div class="bye-player">${esc(p.name)}</div><div class="gender">${p.gender}</div><div class="bye-note">不戦勝・自動確定</div></div></article>${r<tournament.rounds.length-1?'<span class="connector"></span>':''}</div>`}const actions=current?`<div class="match-players"><button type="button" data-match-index="${i}" data-round="${r}" data-side="a" class="player-button ${m.winner===m.a?'selected':''}"><span class="player-name">${esc(a.name)}</span><span class="gender">${a.gender}</span>${m.winner===m.a?'<span class="check">選択中</span>':''}</button><button type="button" data-match-index="${i}" data-round="${r}" data-side="b" class="player-button ${m.winner===m.b?'selected':''}"><span class="player-name">${esc(b.name)}</span><span class="gender">${b.gender}</span>${m.winner===m.b?'<span class="check">選択中</span>':''}</button></div>`:`<div class="match-players"><div class="player-button ${m.winner===m.a?'selected':''}"><span class="player-name">${esc(a.name)}</span><span class="gender">${a.gender}</span>${m.winner===m.a?'<span class="check">勝</span>':''}</div><div class="player-button ${m.winner===m.b?'selected':''}"><span class="player-name">${esc(b.name)}</span><span class="gender">${b.gender}</span>${m.winner===m.b?'<span class="check">勝</span>':''}</div></div>`;return`<div class="old-match"><article class="match-card"><div class="match-meta">${esc(tournament.rounds[r].name)} ・ 試合 ${i+1}</div>${actions}</article>${r<tournament.rounds.length-1?'<span class="connector"></span>':''}</div>`}function render(){if(!tournament)return;const round=tournament.rounds[tournament.currentRound];if(!round){tournament=null;localStorage.removeItem(STORAGE_KEY);return}const real=round.matches.filter(isRealMatch),resolved=real.filter(validWinner).length,finished=tournament.status==="finished"&&!!tournament.champion;$("summary").innerHTML=`<span class="pill">${tournament.players.length}人</span><span class="pill">${finished?"終了":round.name}</span>`;const ready=!finished&&real.length>0&&resolved===real.length;$("tournamentView").innerHTML=`<div class="round-status"><div><div class="round-kicker">${finished?"大会結果":"現在のラウンド"}</div><div class="round-title">${finished?"大会終了":esc(round.name)}</div>${!finished?`<div class="progress">${resolved} / ${real.length} 試合の勝者を選択済み</div>`:""}</div>${finished?"":`<button id="confirmRound" class="confirm" type="button" ${ready?"":"disabled"}>${esc(round.name)}を確定</button>`}</div>${displayMode==="cards"?`<div class="current-grid">${round.matches.map((m,i)=>matchHtml(m,tournament.currentRound,i)).join("")}</div>`:`<div class="bracket-wrap"><div class="bracket">${tournament.rounds.map((x,r)=>`<div class="round-col"><div class="round-label">${esc(x.name)}</div><div class="matches">${x.matches.map((m,i)=>matchHtml(m,r,i)).join("")||'<div class="empty">まだ試合なし</div>'}</div></div>`).join("")}</div></div>`;$("confirmRound")?.addEventListener("click",confirmCurrentRound);$("tournamentView").querySelectorAll("[data-match-index]").forEach(b=>b.addEventListener("click",()=>chooseWinner(Number(b.dataset.round),Number(b.dataset.matchIndex),b.dataset.side)));renderHistory();save()}function chooseWinner(r,i,side){if(!tournament||tournament.status==="finished"||r!==tournament.currentRound)return;const m=tournament.rounds[r]?.matches?.[i];if(!m||!isRealMatch(m))return;const id=side==="a"?m.a:m.b;if(!id)return;m.winner=m.winner===id?null:id;save();render()}function confirmCurrentRound(){if(!tournament||tournament.status==="finished")return;const round=tournament.rounds[tournament.currentRound],real=round.matches.filter(isRealMatch);if(!real.length){showNotice("確定できる試合がありません。");return}if(!real.every(validWinner)){showNotice("まだ勝者が未入力の試合があります。勝者を選択してください。");return}const winners=real.map(m=>m.winner);if(winners.length===1){tournament.champion=winners[0];tournament.status="finished";save();render();return}const next=tournament.rounds[tournament.currentRound+1];if(!next){showNotice("次のラウンドを作成できませんでした。");return}next.matches=[];for(let i=0;i<winners.length;i+=2)next.matches.push(makeMatch(winners[i]||null,winners[i+1]||null));tournament.currentRound++;save();render();window.scrollTo({top:$("tournamentCard").offsetTop-8,behavior:"smooth"})}function renderHistory(){$("history").innerHTML=tournament.rounds.map(r=>`<div class="history-round"><div class="history-round-title">${esc(r.name)}</div>${r.matches.filter(m=>m.a||m.b).map(m=>{const a=player(m.a),b=player(m.b),w=player(m.winner);return`<div class="result-row"><span>${esc(a.name)} vs ${b?esc(b.name):"不戦勝"}</span><span>${w?`勝者：${esc(w.name)}`:"未確定"}</span></div>`}).join("")||'<div class="small">まだ記録なし</div>'}</div>`).join("");const c=player(tournament.champion);$("championArea").innerHTML=c?`<div class="champion"><div class="champion-label">大会結果</div><div class="champion-name">${esc(c.name)}</div><div class="gender">${c.gender}</div></div>`:""}async function copyResults(){if(!tournament)return;let text="じゃんけん大会 対戦結果\n\n";for(const r of tournament.rounds){text+=r.name+"\n";for(const m of r.matches.filter(x=>x.a||x.b)){const a=player(m.a),b=player(m.b),w=player(m.winner);text+=`・${a.name}（${a.gender}） vs ${b?b.name+"（"+b.gender+"）":"不戦勝"} → ${w?"勝者："+w.name:"未確定"}\n`}text+="\n"}if(tournament.champion){const p=player(tournament.champion);text+=`優勝：${p.name}（${p.gender}）\n`}try{await navigator.clipboard.writeText(text);showNotice("結果をコピーしました。")}catch{showNotice("コピーできませんでした。iPadではブラウザのコピー機能をご利用ください。")}}function esc(value){return String(value??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}tournament=load();if(tournament)showTournament();
