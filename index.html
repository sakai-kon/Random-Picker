<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Random Picker | じゃんけん大会</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;--blue:#2563eb;--soft:#eff6ff;--line:#dbe2ea;--muted:#64748b;--green:#15803d;--greenSoft:#ecfdf3;--red:#b91c1c;--redSoft:#fef2f2}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#f5f7fb}button,textarea,select{font:inherit}button{border:0;border-radius:11px;min-height:44px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{max-width:980px;margin:auto;padding:20px 14px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px rgba(15,23,42,.05)}header{margin-bottom:16px}.eyebrow,.step{font-size:11px;color:var(--blue);font-weight:900;letter-spacing:.08em}.brand{font-size:28px;font-weight:900;margin:2px 0}.sub,.hint{color:var(--muted);font-size:13px}.setup{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.field-label{display:block;font-size:13px;font-weight:800;margin:0 0 5px}textarea{width:100%;height:190px;resize:vertical;padding:11px;border:1px solid var(--line);border-radius:11px;line-height:1.5;outline:0}textarea:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px var(--soft)}select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}.settings{display:grid;gap:10px}.setting{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border-radius:0;background:#fff;color:#334155}.seg button.active{background:var(--blue);color:#fff}.primary{width:100%;background:var(--blue);color:#fff;font-size:15px}.ghost{background:#fff;border:1px solid var(--line);color:#334155}.danger{background:var(--redSoft);color:var(--red)}.notice{display:none;padding:10px 11px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin-top:8px;font-size:13px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.summary{display:flex;gap:5px;flex-wrap:wrap}.pill{background:#f1f5f9;color:#475569;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.toolbar,.actions{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 9px}.toolbar button,.actions button{padding:8px 10px;background:#f1f5f9;color:#334155}.toolbar button.active{background:#e8f0ff;color:var(--blue)}.round-status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid #bfdbfe;border-radius:13px;background:var(--soft);margin-bottom:11px}.round-title{font-size:21px;font-weight:900}.progress{font-size:12px;color:#475569}.confirm{min-width:170px;background:var(--green);color:#fff}.confirm:disabled{opacity:.42;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.match{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.03)}.meta{padding:7px 10px;background:#f8fafc;color:var(--muted);font-size:11px;font-weight:800}.players{padding:8px}.player{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;margin:0 0 7px;background:#f8fafc;border:1px solid #e2e8f0;color:#172033}.player:last-child{margin-bottom:0}.player.selected{background:var(--greenSoft);border-color:#86efac;color:#166534}.name{flex:1;overflow-wrap:anywhere;min-width:0}.gender{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}.check{font-size:11px;font-weight:900;white-space:nowrap}.bye{padding:11px;background:#fafafa}.byeName{font-size:16px;font-weight:900;overflow-wrap:anywhere}.byeNote{font-size:12px;color:var(--green);font-weight:800}.bracket-shell{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fbfcfe;padding:12px}.bracket-board{display:flex;align-items:flex-start;min-width:max-content}.bracket-round{width:185px;flex:0 0 185px}.bracket-round-label{text-align:center;font-size:12px;font-weight:900;color:#475569;margin-bottom:8px}.bracket-track{position:relative;height:var(--bracket-height)}.bracket-match-wrap{position:absolute;left:0;right:0;transform:translateY(-50%);z-index:2}.bracket-match{width:100%}.bracket-match .meta{font-size:10px;padding:5px 8px}.bracket-match .players{padding:6px}.bracket-match .player{padding:8px 9px;margin:0 0 5px;font-size:13px;min-height:38px}.bracket-gap{width:28px;flex:0 0 28px}.history{display:grid;gap:7px}.historyRound{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.historyTitle{font-size:12px;font-weight:900;margin-bottom:5px}.result{display:flex;justify-content:space-between;gap:7px;padding:6px 0;border-top:1px solid #e5e7eb;font-size:12px}.result:first-of-type{border-top:0}.result span:last-child{font-weight:800;text-align:right}.champion{margin-top:10px;padding:16px;border:2px solid #93c5fd;border-radius:13px;background:var(--soft);text-align:center}.championName{font-size:26px;font-weight:900;overflow-wrap:anywhere}.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}.rules{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:900px){.app{padding:15px 11px 34px}.setup{grid-template-columns:1fr}.head{display:block}.summary{margin-top:7px}.round-status{align-items:stretch;flex-direction:column}.confirm{width:100%}.grid{grid-template-columns:1fr}.bracket-round{width:172px;flex-basis:172px}}@media(max-width:720px){.app{padding:14px 9px 30px}.card{border-radius:14px;padding:12px}.brand{font-size:25px}.round-title{font-size:20px}.toolbar button,.actions button{flex:1}.bracket-round{width:160px;flex-basis:160px}.bracket-match .player{font-size:12px;padding:7px 8px}.bracket-scroll{padding:8px}}@media print{body{background:#fff}.app{max-width:none;padding:0}.setup,.toolbar,.actions,#startBtn,#clearBtn{display:none!important}.card{border:0;box-shadow:none;margin:0;padding:0}.bracket-shell{border:0;padding:0}.bracket-round{width:155px;flex-basis:155px}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">SCHOOL EVENT / RANDOM PICKER</div><div class="brand">じゃんけん大会</div><p class="sub">参加者を登録して、勝者を選ぶだけ。大会の進行をかんたんに管理できます。</p></header>
<section class="card"><div class="setup">
<div><div class="step">STEP 1</div><h2>参加者を登録</h2><label class="field-label" for="participants">苗字 名前,性別 を1行ずつ入力</label><textarea id="participants" placeholder="田中 太郎,男子&#10;佐藤 花子,女子&#10;鈴木 一郎,男子&#10;山田 花子,女子"></textarea><p class="hint">名前と性別の間はカンマ（,・，・、）。名前の中は半角・全角・Unicode空白のいずれでもOKです。</p><ul class="rules"><li>例：田中 太郎,男子</li><li>例：田中　太郎,男子</li><li>例：田中 太郎,男子（Unicode空白）</li><li>複数人は改行で分けます</li></ul></div>
<div class="settings"><div><div class="step">STEP 2</div><h2>対戦方法</h2><div class="setting"><label class="field-label" for="shuffleMode">組み方</label><select id="shuffleMode"><option value="random">ランダム</option><option value="input">入力順を維持</option><option value="mixedGender">男女をできるだけ混ぜる</option></select></div></div>
<div class="setting"><label class="field-label">表示方法</label><div class="seg"><button id="bracketBtn" type="button">トーナメント</button><button id="cardsBtn" class="active" type="button">試合カード</button></div></div>
<div><div class="step">STEP 3</div><button id="startBtn" class="primary" type="button">大会を開始</button><button id="clearBtn" class="ghost" type="button" style="width:100%;margin-top:6px">入力をクリア</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div></div>
</div></section>
<section class="card" id="tournamentCard" hidden><div class="head"><div><div class="step">大会進行</div><h2 style="margin:0">現在の試合</h2></div><div id="summary" class="summary"></div></div><div class="toolbar"><button id="viewBracket" type="button">トーナメント</button><button id="viewCards" class="active" type="button">試合カード</button><button id="resetTournament" class="danger" type="button">最初から</button></div><div id="tournamentView"></div></section>
<section class="card" id="historyCard" hidden><div class="head"><div><div class="step">記録</div><h2 style="margin:0">対戦結果</h2></div><div class="actions"><button id="copyBtn" class="ghost" type="button">結果をコピー</button><button id="printBtn" class="ghost" type="button">印刷</button></div></div><div id="history" class="history"></div><div id="championArea"></div></section>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), participants=$('participants'), notice=$('notice');
const STATE_KEY='randomPickerTournamentV9', INPUT_KEY='randomPickerParticipantsV8', MAX_PLAYERS=256;
let tournament=null, mode='cards', lastSavedRevision=0;
const showNotice=t=>{notice.textContent=t||'';notice.style.display=t?'block':'none'};
const clean=v=>String(v??'').normalize('NFKC').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'').trim();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto?.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const WHITE_SPACE=/[\p{White_Space}\uFEFF]+/gu;
const GENDER=v=>{v=clean(v).toLowerCase();if(['男子','男','m'].includes(v))return'男子';if(['女子','女','f'].includes(v))return'女子';return''};
function parsePlayers(){
 const lines=String(participants.value??'').replace(/\r\n?/g,'\n').split(/\n+/).map(clean).filter(Boolean);
 if(lines.length<2)throw Error('2人以上の参加者を入力してください。');
 if(lines.length>MAX_PLAYERS)throw Error(`参加者は${MAX_PLAYERS}人までです。`);
 const seen=new Set(), out=[];
 for(const line of lines){
  const m=line.match(/[,，、]/);
  if(!m)throw Error(`「${line}」は「苗字 名前,性別」の形式で入力してください。`);
  const cut=m.index,name=clean(line.slice(0,cut)),gender=GENDER(line.slice(cut+1));
  if(!name||!gender)throw Error(`「${line}」の名前または性別を確認してください。`);
  const parts=name.split(WHITE_SPACE).map(clean).filter(Boolean);
  if(parts.length<2)throw Error(`「${line}」は「苗字 名前,性別」の形式で入力してください。`);
  const normalizedName=parts.join(' '),key=normalizedName.toLowerCase();
  if(seen.has(key))throw Error(`同じ名前が複数あります：「${normalizedName}」`);
  seen.add(key);out.push({id:uid(),name:normalizedName,gender});
 }
 return out;
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function order(a){const m=$('shuffleMode').value;if(m==='input')return [...a];if(m==='random')return shuffle(a);const men=shuffle(a.filter(x=>x.gender==='男子')),women=shuffle(a.filter(x=>x.gender==='女子')),out=[];while(men.length||women.length){if(men.length)out.push(men.shift());if(women.length)out.push(women.shift())}return out}
function nextPow2(n){let s=1;while(s<n)s*=2;return s}
function roundName(i,total){const r=total-i;if(r===1)return'決勝';if(r===2)return'準決勝';if(r===3)return'準々決勝';return`第${i+1}回戦`}
function makeMatch(a=null,b=null){return{a:a||null,b:b||null,winner:(!a||!b)?(a||b):null}}
function makeTournament(players){const size=nextPow2(players.length),total=Math.log2(size),slots=players.map(p=>p.id);while(slots.length<size)slots.push(null);const rounds=Array.from({length:total},(_,i)=>({name:roundName(i,total),matches:[]}));for(let r=0;r<total;r++){const count=size/2**(r+1);for(let i=0;i<count;i++)rounds[r].matches.push(r===0?makeMatch(slots[i*2],slots[i*2+1]):makeMatch())}const now=Date.now();return{version:9,players,rounds,currentRound:0,champion:null,status:'active',groupMode:$('shuffleMode').value,createdAt:now,updatedAt:now}}
function getPlayer(id){return tournament?.players.find(p=>p.id===id)||null}
function activeMatches(round){return(round?.matches||[]).filter(m=>m?.a||m?.b)}
function valid(m){return!!m&&!!m.winner&&(m.winner===m.a||m.winner===m.b)}
function load(){try{const raw=localStorage.getItem(STATE_KEY);if(!raw)return null;const s=JSON.parse(raw);if(!s||s.version!==9||!Array.isArray(s.players)||!Array.isArray(s.rounds))return null;return s}catch{return null}}
function save(){if(!tournament)return false;try{tournament.updatedAt=Date.now();localStorage.setItem(STATE_KEY,JSON.stringify(tournament));lastSavedRevision=tournament.updatedAt;return true}catch{showNotice('大会結果を保存できませんでした。');return false}}
function playerHtml(m,r,i,interactive=false){const a=getPlayer(m.a),b=getPlayer(m.b),label=`${esc(tournament.rounds[r].name)} ・ 試合 ${i+1}`;if(!a&&!b)return`<div class="match"><div class="meta">${label}</div><div class="empty">対戦者待ち</div></div>`;if(!a||!b){const p=a||b;return`<div class="match"><div class="meta">${label}</div><div class="bye"><div class="byeName">${esc(p.name)}</div><div class="gender">${esc(p.gender)}</div><div class="byeNote">不戦勝・自動確定</div></div></div>`}const row=(side,p)=>interactive?`<button type="button" class="player ${m.winner===p.id?'selected':''}" data-r="${r}" data-i="${i}" data-side="${side}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">選択中</span>':''}</button>`:`<div class="player ${m.winner===p.id?'selected':''}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">勝</span>':''}</div>`;return`<div class="match"><div class="meta">${label}</div><div class="players">${row('a',a)}${row('b',b)}</div></div>`}
function renderCards(){const r=tournament.currentRound,round=tournament.rounds[r];return`<div class="grid">${round.matches.map((m,i)=>playerHtml(m,r,i,tournament.status==='active')).join('')}</div>`}
function renderBracket(){const end=tournament.status==='finished'?tournament.rounds.length-1:tournament.currentRound,first=activeMatches(tournament.rounds[0]).length||1,height=Math.max(440,first*108);let h='<div class="bracket-shell"><div class="bracket-board">';for(let r=0;r<=end;r++){const round=tournament.rounds[r],ms=activeMatches(round);if(!ms.length)continue;h+=`<div class="bracket-round"><div class="bracket-round-label">${esc(round.name)}</div><div class="bracket-track" style="--bracket-height:${height}px">`;round.matches.forEach((m,i)=>{if(!m.a&&!m.b)return;const top=((i+0.5)/(round.matches.length))*100;h+=`<div class="bracket-match-wrap" style="top:${top}%">${playerHtml(m,r,i,false)}</div>`});h+='</div></div>';if(r<end)h+='<div class="bracket-gap"></div>'}return h+'</div></div>'}
function renderHistory(){const rows=tournament.rounds.map(r=>{const ms=activeMatches(r);if(!ms.length)return'';return`<div class="historyRound"><div class="historyTitle">${esc(r.name)}</div>${ms.map(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);return`<div class="result"><span>${esc(a?.name||b?.name||'')}</span><span>${a&&b?'vs ':''}${esc(b?.name||'')}${w?` → ${esc(w.name)}`:''}</span></div>`}).join('')}</div>`}).join('');$('history').innerHTML=rows||'<div class="empty">まだ記録がありません。</div>';const c=getPlayer(tournament.champion);$('championArea').innerHTML=c?`<div class="champion"><div class="step">優勝</div><div class="championName">${esc(c.name)}</div><div class="gender">${esc(c.gender)}</div></div>`:''}
function render(){if(!tournament)return;const round=tournament.rounds[tournament.currentRound],matches=activeMatches(round),resolved=matches.filter(valid).length,finished=tournament.status==='finished',ready=!finished&&matches.length&&resolved===matches.length;$('summary').innerHTML=`<span class="pill">${tournament.players.length}人</span><span class="pill">${finished?'大会終了':esc(round.name)}</span>`;const content=finished?`<div class="round-status"><div><div class="step">大会結果</div><div class="round-title">大会終了</div></div></div>${renderBracket()}`:mode==='cards'?renderCards():renderBracket();$('tournamentView').innerHTML=finished?content:`<div class="round-status"><div><div class="step">現在のラウンド</div><div class="round-title">${esc(round.name)}</div><div class="progress">${resolved} / ${matches.length} 試合の勝者を選択済み</div></div><button id="confirmRound" class="confirm" type="button" ${ready?'':'disabled'}>${esc(round.name)}を確定</button></div>${content}`;$('confirmRound')?.addEventListener('click',confirmRound);$('tournamentView').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.r,+b.dataset.i,b.dataset.side)));renderHistory()}
function choose(r,i,side){if(!tournament||tournament.status==='finished'||r!==tournament.currentRound)return;const m=tournament.rounds[r]?.matches?.[i];if(!m||!m.a||!m.b)return;m.winner=m.winner===m[side] ? null:m[side];if(save())render()}
function confirmRound(){const r=tournament.currentRound,round=tournament.rounds[r],ms=activeMatches(round);if(!ms.length||!ms.every(valid)){showNotice('すべての試合で勝者を選択してください。');return}const winners=ms.map(m=>m.winner);if(winners.length===1){tournament.champion=winners[0];tournament.status='finished';save();render();return}const next=tournament.rounds[r+1];for(let i=0;i<next.matches.length;i++)next.matches[i]=i<winners.length?makeMatch(winners[i*2],winners[i*2+1]):makeMatch();tournament.currentRound++;save();render()}
function start(){try{const players=order(parsePlayers());tournament=makeTournament(players);save();showNotice('');$('tournamentCard').hidden=false;$('historyCard').hidden=false;render();$('tournamentCard').scrollIntoView({behavior:'smooth'})}catch(e){showNotice(e.message)}}
function reset(){if(!confirm('大会を最初からやり直しますか？'))return;localStorage.removeItem(STATE_KEY);tournament=null;$('tournamentCard').hidden=true;$('historyCard').hidden=true;$('tournamentView').innerHTML='';$('history').innerHTML='';$('championArea').innerHTML=''}
async function copyResults(){const lines=['じゃんけん大会 対戦結果',''];tournament.rounds.forEach(r=>{lines.push(r.name);activeMatches(r).forEach(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);lines.push(`・${a?.name||''}${b?' vs '+b.name:''}${w?' → '+w.name:''}`)});lines.push('')});if(tournament.champion)lines.push('優勝：'+getPlayer(tournament.champion).name);const text=lines.join('\n');try{await navigator.clipboard.writeText(text);showNotice('結果をコピーしました。')}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showNotice('結果をコピーしました。')}}
$('bracketBtn').onclick=()=>{mode='bracket';$('bracketBtn').classList.add('active');$('cardsBtn').classList.remove('active');if(tournament)render()};$('cardsBtn').onclick=()=>{mode='cards';$('cardsBtn').classList.add('active');$('bracketBtn').classList.remove('active');if(tournament)render()};$('viewBracket').onclick=()=>{mode='bracket';$('viewBracket').classList.add('active');$('viewCards').classList.remove('active');render()};$('viewCards').onclick=()=>{mode='cards';$('viewCards').classList.add('active');$('viewBracket').classList.remove('active');render()};$('startBtn').onclick=start;$('clearBtn').onclick=()=>{participants.value='';localStorage.removeItem(INPUT_KEY);showNotice('')};$('resetTournament').onclick=reset;$('copyBtn').onclick=copyResults;$('printBtn').onclick=()=>print();participants.oninput=()=>localStorage.setItem(INPUT_KEY,participants.value);participants.value=localStorage.getItem(INPUT_KEY)||'';
try{tournament=load();if(tournament){$('tournamentCard').hidden=false;$('historyCard').hidden=false;$('shuffleMode').value=tournament.groupMode||'random';lastSavedRevision=tournament.updatedAt||0;render()}}catch{}
})();
</script>
</body>
</html>
