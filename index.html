<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Random Picker | じゃんけん大会</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;--blue:#2563eb;--soft:#eff6ff;--line:#dbe2ea;--muted:#64748b;--green:#15803d;--greenSoft:#ecfdf3;--red:#b91c1c;--redSoft:#fef2f2;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button,textarea,select{font:inherit}button{border:0;border-radius:11px;min-height:46px;font-weight:800;cursor:pointer;touch-action:manipulation}.app{max-width:980px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px rgba(15,23,42,.06)}header{margin-bottom:20px}.eyebrow,.step{font-size:11px;color:var(--blue);font-weight:900;letter-spacing:.08em}.brand{font-size:30px;font-weight:900;margin:2px 0}.sub,.hint{color:var(--muted);font-size:13px}.setup{display:grid;grid-template-columns:1.35fr .85fr;gap:18px}.field-label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}textarea{width:100%;height:220px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:12px;line-height:1.5;outline:0}textarea:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px var(--soft)}select{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}.settings{display:grid;gap:13px}.setting{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fbfcfe}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border-radius:0;background:#fff;color:#334155}.seg button.active{background:var(--blue);color:#fff}.primary{width:100%;background:var(--blue);color:#fff;font-size:16px}.ghost{background:#fff;border:1px solid var(--line);color:#334155}.danger{background:var(--redSoft);color:var(--red)}.notice{display:none;padding:11px 12px;border-radius:11px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:13px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.summary{display:flex;gap:6px;flex-wrap:wrap}.pill{background:#f1f5f9;color:#475569;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.toolbar,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 10px}.toolbar button,.actions button{padding:9px 12px;background:#f1f5f9;color:#334155}.toolbar button.active{background:#e8f0ff;color:var(--blue)}.toolbar .danger{background:var(--redSoft);color:var(--red)}.round-status{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px;border:1px solid #bfdbfe;border-radius:14px;background:var(--soft);margin-bottom:14px}.round-title{font-size:24px;font-weight:900}.progress{font-size:12px;color:#475569}.confirm{min-width:180px;background:var(--green);color:#fff}.confirm:disabled{opacity:.42;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.match{border:1px solid var(--line);border-radius:15px;overflow:hidden}.meta{padding:9px 12px;background:#f8fafc;color:var(--muted);font-size:11px;font-weight:800}.players{padding:10px}.player{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:13px 14px;margin:0 0 8px;background:#f8fafc;border:1px solid #e2e8f0;color:#172033}.player:last-child{margin-bottom:0}.player.selected{background:var(--greenSoft);border-color:#86efac;color:#166534}.name{flex:1;overflow-wrap:anywhere}.gender{font-size:11px;color:var(--muted);font-weight:800}.check{font-size:11px;font-weight:900}.bye{padding:14px;background:#fafafa}.byeName{font-size:18px;font-weight:900}.byeNote{font-size:12px;color:var(--green);font-weight:800}.bracket{display:flex;gap:24px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfcfe}.round{width:220px;flex:0 0 220px}.roundLabel{text-align:center;font-size:12px;font-weight:900;color:#475569;margin-bottom:8px}.roundMatches{display:grid;gap:10px}.history{display:grid;gap:8px}.historyRound{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fbfcfe}.historyTitle{font-size:12px;font-weight:900;margin-bottom:6px}.result{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #e5e7eb;font-size:12px}.result:first-of-type{border-top:0}.result span:last-child{font-weight:800}.champion{margin-top:12px;padding:18px;border:2px solid #93c5fd;border-radius:14px;background:var(--soft);text-align:center}.championName{font-size:28px;font-weight:900}.empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:720px){.app{padding:17px 11px 34px}.setup{grid-template-columns:1fr}.head{display:block}.summary{margin-top:8px}.round-status{align-items:stretch;flex-direction:column}.confirm{width:100%}.grid{grid-template-columns:1fr}.toolbar button,.actions button{flex:1}.round{width:210px;flex-basis:210px}.player{min-height:62px;font-size:16px}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">SCHOOL EVENT / RANDOM PICKER</div><div class="brand">じゃんけん大会</div><p class="sub">参加者を登録して、勝者を選ぶだけ。大会の進行をかんたんに管理できます。</p></header>
<section class="card"><div class="setup">
<div><div class="step">STEP 1</div><h2>参加者を登録</h2><label class="field-label" for="participants">名前と性別を1行ずつ入力</label><textarea id="participants" placeholder="田中 男子&#10;佐藤 女子&#10;鈴木 男子&#10;山田 女子"></textarea><p class="hint">例：田中 男子 ／ 佐藤 女子（半角・全角スペースどちらでもOK）</p></div>
<div class="settings"><div><div class="step">STEP 2</div><h2>対戦方法</h2><div class="setting"><label class="field-label" for="shuffleMode">組み方</label><select id="shuffleMode"><option value="random">ランダム</option><option value="input">入力順を維持</option><option value="mixedGender">男女をできるだけ混ぜる</option></select></div></div>
<div class="setting"><label class="field-label">表示方法</label><div class="seg"><button id="bracketBtn" type="button">トーナメント</button><button id="cardsBtn" class="active" type="button">試合カード</button></div></div>
<div><div class="step">STEP 3</div><button id="startBtn" class="primary" type="button">大会を開始</button><button id="clearBtn" class="ghost" type="button" style="width:100%;margin-top:7px">入力をクリア</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div>
</div></div></section>
<section class="card" id="tournamentCard" hidden><div class="head"><div><div class="step">大会進行</div><h2 style="margin:0">現在の試合</h2></div><div id="summary" class="summary"></div></div><div class="toolbar"><button id="viewBracket" type="button">トーナメント</button><button id="viewCards" class="active" type="button">試合カード</button><button id="resetTournament" class="danger" type="button">最初から</button></div><div id="tournamentView"></div></section>
<section class="card" id="historyCard" hidden><div class="head"><div><div class="step">記録</div><h2 style="margin:0">対戦結果</h2></div><div class="actions"><button id="copyBtn" class="ghost" type="button">結果をコピー</button><button id="printBtn" class="ghost" type="button">印刷</button></div></div><div id="history" class="history"></div><div id="championArea"></div></section>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const participants=$('participants'),notice=$('notice');
const STATE_KEY='randomPickerTournamentV4',INPUT_KEY='randomPickerParticipantsV4';
let tournament=null,mode='cards';
const showNotice=text=>{notice.textContent=text||'';notice.style.display=text?'block':'none'};
const uid=()=>globalThis.crypto&&typeof crypto.randomUUID==='function'?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeGender(v){v=String(v).trim();if(['男子','男','M','m'].includes(v))return'男子';if(['女子','女','F','f'].includes(v))return'女子';return''}
function parsePlayers(){const lines=participants.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(lines.length<2)throw Error('2人以上の参加者を入力してください。');const seen=new Set();return lines.map(line=>{const p=line.split(/\s+/).filter(Boolean);if(p.length<2)throw Error(`名前と性別をスペースで区切ってください：「${line}」`);const g=normalizeGender(p.at(-1)),name=p.slice(0,-1).join(' ');if(!g||!name)throw Error(`名前と性別を確認してください：「${line}」`);const key=name.normalize('NFKC');if(seen.has(key))throw Error(`同じ名前が複数あります：「${name}」`);seen.add(key);return{id:uid(),name,gender:g}})}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function order(players){const m=$('shuffleMode').value;if(m==='input')return[...players];if(m==='random')return shuffle(players);const men=shuffle(players.filter(p=>p.gender==='男子')),women=shuffle(players.filter(p=>p.gender==='女子')),out=[];while(men.length||women.length){if(men.length&&women.length)out.push(men.shift(),women.shift());else out.push(men.shift()||women.shift())}return out}
function nextPow2(n){let s=1;while(s<n)s*=2;return s}
function roundName(i,total){const r=total-i;if(r===1)return'決勝';if(r===2)return'準決勝';if(r===3)return'準々決勝';return`第${i+1}回戦`}
function match(a=null,b=null){const bye=!a||!b;return{a,b,winner:bye?(a||b):null,bye}}
function makeTournament(players){const size=nextPow2(players.length),total=Math.log2(size),slots=players.map(p=>p.id);while(slots.length<size)slots.push(null);const rounds=Array.from({length:total},(_,i)=>({name:roundName(i,total),matches:[]}));for(let i=0;i<size;i+=2)rounds[0].matches.push(match(slots[i],slots[i+1]));return{version:4,players,rounds,currentRound:0,champion:null,status:'active'}}
function getPlayer(id){return id&&tournament?tournament.players.find(p=>p.id===id)||null:null}
function real(m){return!!m.a&&!!m.b}
function valid(m){return!!m.winner&&(m.winner===m.a||m.winner===m.b)}
function save(){try{if(tournament)localStorage.setItem(STATE_KEY,JSON.stringify(tournament));else localStorage.removeItem(STATE_KEY)}catch{}}
function load(){try{const raw=localStorage.getItem(STATE_KEY);if(!raw)return null;const s=JSON.parse(raw);if(!s||s.version!==4||!Array.isArray(s.players)||!Array.isArray(s.rounds))return null;const ids=new Set(s.players.map(p=>p.id));s.rounds.forEach(r=>(r.matches||[]).forEach(m=>{m.a=ids.has(m.a)?m.a:null;m.b=ids.has(m.b)?m.b:null;m.bye=!!m.bye||!m.a||!m.b;if(m.bye)m.winner=m.a||m.b||null;else if(!valid(m))m.winner=null}));if(!Number.isInteger(s.currentRound)||s.currentRound<0||s.currentRound>=s.rounds.length)s.currentRound=0;s.champion=s.champion&&ids.has(s.champion)?s.champion:null;s.status=s.champion?'finished':'active';return s}catch{return null}}
function setMode(next){mode=next==='bracket'?'bracket':'cards';$('bracketBtn').classList.toggle('active',mode==='bracket');$('cardsBtn').classList.toggle('active',mode==='cards');$('viewBracket').classList.toggle('active',mode==='bracket');$('viewCards').classList.toggle('active',mode==='cards');if(tournament)render()}
function start(){try{tournament=makeTournament(order(parsePlayers()));save();showTournament()}catch(e){showNotice(e instanceof Error?e.message:'入力を確認してください。')}}
function showTournament(){showNotice('');$('tournamentCard').hidden=false;$('historyCard').hidden=false;render();$('tournamentCard').scrollIntoView({behavior:'smooth',block:'start'})}
function reset(){if(!tournament)return;if(!confirm('大会を最初からやり直しますか？現在の大会結果を削除します。'))return;tournament=null;save();$('tournamentCard').hidden=true;$('historyCard').hidden=true;$('tournamentView').innerHTML='';$('history').innerHTML='';$('championArea').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function playerHtml(m,r,i,interactive){const a=getPlayer(m.a),b=getPlayer(m.b);if(!a&&!b)return'';const label=`${esc(tournament.rounds[r].name)} ・ 試合 ${i+1}`;if(!real(m)){const p=a||b;return`<div class="match"><div class="meta">${label}</div><div class="bye"><div class="byeName">${esc(p.name)}</div><div class="gender">${esc(p.gender)}</div><div class="byeNote">不戦勝・自動確定</div></div></div>`}const row=(side,p)=>interactive?`<button type="button" class="player ${m.winner===p.id?'selected':''}" data-r="${r}" data-i="${i}" data-side="${side}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">選択中</span>':''}</button>`:`<div class="player ${m.winner===p.id?'selected':''}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">勝</span>':''}</div>`;return`<div class="match"><div class="meta">${label}</div><div class="players">${row('a',a)}${row('b',b)}</div></div>`}
function renderCards(){const r=tournament.currentRound,round=tournament.rounds[r];return`<div class="grid">${round.matches.map((m,i)=>playerHtml(m,r,i,tournament.status!=='finished')).join('')}</div>`}
function renderBracket(){return`<div class="bracket">${tournament.rounds.map((round,r)=>`<div class="round"><div class="roundLabel">${esc(round.name)}</div><div class="roundMatches">${round.matches.map((m,i)=>playerHtml(m,r,i,r===tournament.currentRound&&tournament.status!=='finished')).join('')||'<div class="empty">まだ試合なし</div>'}</div></div>`).join('')}</div>`}
function choose(r,i,side){if(!tournament||tournament.status==='finished'||r!==tournament.currentRound)return;const m=tournament.rounds[r]?.matches?.[i];if(!m||!real(m))return;const id=side==='a'?m.a:m.b;if(!id)return;m.winner=m.winner===id?null:id;showNotice('');save();render()}
function confirmRound(){if(!tournament||tournament.status==='finished')return;const round=tournament.rounds[tournament.currentRound],matches=round.matches.filter(real);if(!matches.length){showNotice('確定できる試合がありません。');return}if(!matches.every(valid)){showNotice('まだ勝者が未入力の試合があります。勝者を選択してください。');return}const winners=matches.map(m=>m.winner);if(winners.length===1){tournament.champion=winners[0];tournament.status='finished';save();render();return}const next=tournament.rounds[tournament.currentRound+1];if(!next){showNotice('次のラウンドを作成できませんでした。');return}next.matches=[];for(let i=0;i<winners.length;i+=2)next.matches.push(match(winners[i],winners[i+1]||null));tournament.currentRound++;save();render();$('tournamentCard').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){if(!tournament)return;const round=tournament.rounds[tournament.currentRound];if(!round){tournament=null;save();return}const realMatches=round.matches.filter(real),resolved=realMatches.filter(valid).length,finished=tournament.status==='finished'&&!!tournament.champion;const ready=!finished&&realMatches.length>0&&resolved===realMatches.length;$('summary').innerHTML=`<span class="pill">${tournament.players.length}人</span><span class="pill">${finished?'終了':esc(round.name)}</span>`;const body=mode==='cards'?renderCards():renderBracket();$('tournamentView').innerHTML=`<div class="round-status"><div><div class="step">${finished?'大会結果':'現在のラウンド'}</div><div class="round-title">${finished?'大会終了':esc(round.name)}</div>${finished?'':`<div class="progress">${resolved} / ${realMatches.length} 試合の勝者を選択済み</div>`}</div>${finished?'':`<button id="confirmRound" class="confirm" type="button" ${ready?'':'disabled'}>${esc(round.name)}を確定</button>`}</div>${body}`;$('confirmRound')?.addEventListener('click',confirmRound);$('tournamentView').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.r),Number(b.dataset.i),b.dataset.side)));renderHistory();save()}
function renderHistory(){$('history').innerHTML=tournament.rounds.map(r=>{const rows=r.matches.filter(m=>m.a||m.b).map(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);if(!a&&!b)return'';const matchup=a?`${esc(a.name)}${b?` vs ${esc(b.name)}`:' vs 不戦勝'}`:`不戦勝 ${esc(b.name)}`;return`<div class="result"><span>${matchup}</span><span>${w?`勝者：${esc(w.name)}`:'未確定'}</span></div>`}).join('');return`<div class="historyRound"><div class="historyTitle">${esc(r.name)}</div>${rows||'<div class="empty">まだ記録なし</div>'}</div>`}).join('');const c=getPlayer(tournament.champion);$('championArea').innerHTML=c?`<div class="champion"><div class="step">大会結果</div><div class="championName">${esc(c.name)}</div><div class="gender">${esc(c.gender)}</div></div>`:''}
async function copyResults(){if(!tournament)return;const out=['じゃんけん大会 対戦結果',''];tournament.rounds.forEach(r=>{out.push(r.name);r.matches.filter(m=>m.a||m.b).forEach(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);if(!a&&!b)return;out.push(`・${a?a.name:'不戦勝'}${b?` vs ${b.name}`:''} → ${w?`勝者：${w.name}`:'未確定'}`)});out.push('')});if(tournament.champion)out.push(`優勝：${getPlayer(tournament.champion).name}`);const text=out.join('\n');try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else throw Error('clipboard unavailable');showNotice('結果をコピーしました。')}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();showNotice(ok?'結果をコピーしました。':'コピーできませんでした。端末のコピー機能をご利用ください。')}}
$('bracketBtn').addEventListener('click',()=>setMode('bracket'));$('cardsBtn').addEventListener('click',()=>setMode('cards'));$('viewBracket').addEventListener('click',()=>setMode('bracket'));$('viewCards').addEventListener('click',()=>setMode('cards'));$('startBtn').addEventListener('click',start);$('clearBtn').addEventListener('click',()=>{participants.value='';try{localStorage.removeItem(INPUT_KEY)}catch{}showNotice('');participants.focus()});$('resetTournament').addEventListener('click',reset);$('copyBtn').addEventListener('click',copyResults);$('printBtn').addEventListener('click',()=>window.print());participants.addEventListener('input',()=>{try{localStorage.setItem(INPUT_KEY,participants.value)}catch{}});
try{const saved=localStorage.getItem(INPUT_KEY);if(saved)participants.value=saved}catch{};
tournament=load();if(tournament)showTournament();
})();
</script>
</body>
</html>
