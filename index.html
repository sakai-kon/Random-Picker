<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;--blue:#2563eb;--soft:#eff6ff;--line:#dbe2ea;--muted:#64748b;--green:#15803d;--greenSoft:#ecfdf3;--red:#b91c1c;--redSoft:#fef2f2}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:#f5f7fb}button,textarea,select{font:inherit}button{border:0;border-radius:11px;min-height:44px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{max-width:980px;margin:auto;padding:20px 14px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 5px 20px rgba(15,23,42,.05)}header{margin-bottom:16px}.eyebrow,.step{font-size:11px;color:var(--blue);font-weight:900;letter-spacing:.08em}.brand{font-size:28px;font-weight:900;margin:2px 0}.sub,.hint{color:var(--muted);font-size:13px}.setup{display:grid;grid-template-columns:1.35fr .85fr;gap:14px}.field-label{display:block;font-size:13px;font-weight:800;margin:0 0 5px}textarea{width:100%;height:190px;resize:vertical;padding:11px;border:1px solid var(--line);border-radius:11px;line-height:1.5;outline:0}textarea:focus,select:focus{border-color:#93c5fd;box-shadow:0 0 0 3px var(--soft)}select{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff}.settings{display:grid;gap:10px}.setting{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border-radius:0;background:#fff;color:#334155}.seg button.active{background:var(--blue);color:#fff}.primary{width:100%;background:var(--blue);color:#fff;font-size:15px}.ghost{background:#fff;border:1px solid var(--line);color:#334155}.danger{background:var(--redSoft);color:var(--red)}.notice{display:none;padding:10px 11px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:13px;margin-top:8px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.summary{display:flex;gap:5px;flex-wrap:wrap}.pill{background:#f1f5f9;color:#475569;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}.toolbar,.actions{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 9px}.toolbar button,.actions button{padding:8px 10px;background:#f1f5f9;color:#334155}.toolbar button.active{background:#e8f0ff;color:var(--blue)}.toolbar .danger{background:var(--redSoft);color:var(--red)}.round-status{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid #bfdbfe;border-radius:13px;background:var(--soft);margin-bottom:11px}.round-title{font-size:21px;font-weight:900}.progress{font-size:12px;color:#475569}.confirm{min-width:170px;background:var(--green);color:#fff}.confirm:disabled{opacity:.42;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:10px}.match{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(15,23,42,.03)}.meta{padding:7px 10px;background:#f8fafc;color:var(--muted);font-size:11px;font-weight:800}.players{padding:8px}.player{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;margin:0 0 7px;background:#f8fafc;border:1px solid #e2e8f0;color:#172033}.player:last-child{margin-bottom:0}.player.selected{background:var(--greenSoft);border-color:#86efac;color:#166534}.name{flex:1;overflow-wrap:anywhere;min-width:0}.gender{font-size:11px;color:var(--muted);font-weight:800;white-space:nowrap}.check{font-size:11px;font-weight:900;white-space:nowrap}.bye{padding:11px;background:#fafafa}.byeName{font-size:16px;font-weight:900;overflow-wrap:anywhere}.byeNote{font-size:12px;color:var(--green);font-weight:800}.emptySlot{min-height:38px;display:flex;align-items:center;justify-content:center;padding:8px 10px;background:#fafafa;color:#94a3b8;font-size:12px;font-weight:800}.bracket-shell{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fbfcfe}.bracket-scroll{overflow-x:auto;overflow-y:hidden;padding:12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.bracket-board{display:flex;align-items:flex-start;min-width:max-content}.bracket-round{width:190px;flex:0 0 190px}.bracket-round-label{text-align:center;font-size:12px;font-weight:900;color:#475569;margin-bottom:8px}.bracket-track{position:relative;height:var(--bracket-height)}.bracket-match-wrap{position:absolute;left:0;right:0;transform:translateY(-50%);z-index:2}.bracket-match{width:100%}.bracket-match .meta{font-size:10px;padding:5px 8px}.bracket-match .players{padding:6px}.bracket-match .player{padding:8px 9px;margin:0 0 5px;font-size:13px;min-height:38px}.bracket-match .bye{padding:8px}.bracket-match .byeName{font-size:14px}.bracket-gap{position:relative;width:34px;flex:0 0 34px;height:var(--bracket-height)}.bracket-gap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.bracket-gap path{fill:none;stroke:#cbd5e1;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}.history{display:grid;gap:7px}.historyRound{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.historyTitle{font-size:12px;font-weight:900;margin-bottom:5px}.result{display:flex;justify-content:space-between;gap:7px;padding:6px 0;border-top:1px solid #e5e7eb;font-size:12px}.result:first-of-type{border-top:0}.result span:last-child{font-weight:800;text-align:right}.champion{margin-top:10px;padding:16px;border:2px solid #93c5fd;border-radius:13px;background:var(--soft);text-align:center}.championName{font-size:26px;font-weight:900;overflow-wrap:anywhere}.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}.rules{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.6}
@media(max-width:900px){.app{padding:15px 11px 34px}.setup{grid-template-columns:1fr}.head{display:block}.summary{margin-top:7px}.round-status{align-items:stretch;flex-direction:column}.confirm{width:100%}.grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.actions{margin-top:9px}.bracket-round{width:178px;flex-basis:178px}.bracket-gap{width:26px;flex-basis:26px}}@media(max-width:720px){.app{padding:14px 9px 30px}.card{border-radius:14px;padding:12px}.brand{font-size:25px}.round-title{font-size:20px}.grid{grid-template-columns:1fr}.toolbar button,.actions button{flex:1}.bracket-round{width:166px;flex-basis:166px}.bracket-round-label{font-size:11px}.bracket-gap{width:22px;flex-basis:22px}.bracket-match .player{font-size:12px;padding:7px 8px}.bracket-match .meta{font-size:9px}.bracket-scroll{padding:8px}}@media print{body{background:#fff}.app{max-width:none;padding:0}.setup,.toolbar,.actions,#startBtn,#clearBtn{display:none!important}.card{border:0;box-shadow:none;margin:0;padding:0}.bracket-shell{border:0;overflow:visible}.bracket-scroll{overflow:visible;padding:0}.bracket-round{width:160px;flex-basis:160px}.bracket-gap{width:12px;flex-basis:12px}.bracket-match .player{font-size:11px;padding:6px}.bracket-match .meta{font-size:9px;padding:4px 6px}.bracket-gap svg{overflow:visible}.final-bracket{margin-top:0;padding-top:0;border-top:0}}
</style>
</head>
<body>
<div class="app">
<header><div class="eyebrow">SCHOOL EVENT / RANDOM PICKER</div><div class="brand">じゃんけん大会</div><p class="sub">参加者を登録して、勝者を選ぶだけ。大会の進行をかんたんに管理できます。</p></header>
<section class="card"><div class="setup">
<div><div class="step">STEP 1</div><h2>参加者を登録</h2><label class="field-label" for="participants">苗字 名前,性別 を1行ずつ入力</label><textarea id="participants" placeholder="田中 太郎,男子&#10;佐藤 花子,女子&#10;鈴木 一郎,男子&#10;山田 花子,女子"></textarea><p class="hint">基本形式：<strong>苗字 名前,性別</strong>。複数人は改行で分けます。</p><ul class="rules"><li>例：田中 太郎,男子</li><li>性別は 男子・女子・男・女・M・F に対応</li><li>カンマは名前と性別の区切り。参加者同士は改行で区切ります</li></ul></div>
<div class="settings"><div><div class="step">STEP 2</div><h2>対戦方法</h2><div class="setting"><label class="field-label" for="shuffleMode">組み方</label><select id="shuffleMode"><option value="random">ランダム</option><option value="input">入力順を維持</option><option value="mixedGender">男女をできるだけ混ぜる</option></select></div></div>
<div class="setting"><label class="field-label">表示方法</label><div class="seg"><button id="bracketBtn" type="button">トーナメント</button><button id="cardsBtn" class="active" type="button">試合カード</button></div></div>
<div><div class="step">STEP 3</div><button id="startBtn" class="primary" type="button">大会を開始</button><button id="clearBtn" class="ghost" type="button" style="width:100%;margin-top:6px">入力をクリア</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div>
</div></div></section>
<section class="card" id="tournamentCard" hidden><div class="head"><div><div class="step">大会進行</div><h2 style="margin:0">現在の試合</h2></div><div id="summary" class="summary"></div></div>
<div class="toolbar"><button id="viewBracket" type="button">トーナメント</button><button id="viewCards" class="active" type="button">試合カード</button><button id="resetTournament" class="danger" type="button">最初から</button></div><div id="tournamentView"></div></section>
<section class="card" id="historyCard" hidden><div class="head"><div><div class="step">記録</div><h2 style="margin:0">対戦結果</h2></div><div class="actions"><button id="copyBtn" class="ghost" type="button">結果をコピー</button><button id="printBtn" class="ghost" type="button">印刷</button></div></div><div id="history" class="history"></div><div id="championArea"></div></section>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const participants=$('participants'),notice=$('notice');
const STATE_KEY='randomPickerTournamentV8',INPUT_KEY='randomPickerParticipantsV7',MAX_PLAYERS=256;
let tournament=null,mode='cards',lastSavedRevision=0;
const showNotice=text=>{notice.textContent=text||'';notice.style.display=text?'block':'none'};
const uid=()=>globalThis.crypto&&typeof crypto.randomUUID==='function'?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}-${Math.random().toString(16).slice(2)}`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanText=v=>String(v??'').normalize('NFKC').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'').trim();
const normalizeGender=v=>{v=cleanText(v).toLowerCase();if(['男子','男','m'].includes(v))return'男子';if(['女子','女','f'].includes(v))return'女子';return''};
function parsePlayers(){
 const text=String(participants.value??'').replace(/\r\n?/g,'\n').replace(/[\u2028\u2029]/g,'\n');
 const lines=text.split('\n').map(cleanText).filter(Boolean);
 if(lines.length<2)throw Error('2人以上の参加者を入力してください。');
 if(lines.length>MAX_PLAYERS)throw Error(`参加者は${MAX_PLAYERS}人までです。`);
 const seen=new Set(),players=[];
 for(const line of lines){
  const commaMatches=[...line.matchAll(/[,，、]/g)];
  if(!commaMatches.length)throw Error(`「${line}」は「苗字 名前,性別」の形式で入力してください。`);
  const idx=commaMatches.at(-1).index;
  const name=cleanText(line.slice(0,idx));
  const gender=normalizeGender(line.slice(idx+1));
  if(!name||!gender)throw Error(`「${line}」の名前または性別を確認してください。`);
  if(!name.includes(' ')){
   const parts=name.split(/\s+/).filter(Boolean);
   if(parts.length<2)throw Error(`「${line}」は「苗字 名前,性別」の形式で入力してください。`);
  }
  const key=name.replace(/\s+/g,' ').normalize('NFKC');
  if(seen.has(key))throw Error(`同じ名前が複数あります：「${name}」`);
  seen.add(key);players.push({id:uid(),name,gender});
 }
 return players;
}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function order(players){const m=$('shuffleMode').value;if(m==='input')return [...players];if(m==='random')return shuffle(players);const men=shuffle(players.filter(p=>p.gender==='男子'));const women=shuffle(players.filter(p=>p.gender==='女子'));const other=shuffle(players.filter(p=>!['男子','女子'].includes(p.gender)));const out=[];while(men.length||women.length){if(men.length)out.push(men.shift());if(women.length)out.push(women.shift())}return out.concat(other)}
function nextPow2(n){let s=1;while(s<n)s*=2;return s}
function roundName(i,total){const r=total-i;if(r===1)return'決勝';if(r===2)return'準決勝';if(r===3)return'準々決勝';return`第${i+1}回戦`}
function match(a=null,b=null){return{a:a||null,b:b||null,winner:(!a&&!b)?null:(a||b),bye:!a||!b}}
function makeTournament(players){const size=nextPow2(players.length),total=Math.log2(size),slots=players.map(p=>p.id);while(slots.length<size)slots.push(null);const rounds=Array.from({length:total},(_,i)=>({name:roundName(i,total),matches:[]}));for(let r=0;r<total;r++){const count=size/2**(r+1);for(let i=0;i<count;i++)rounds[r].matches.push(r===0?match(slots[i*2],slots[i*2+1]):match())}const now=Date.now();return{version:8,players,rounds,currentRound:0,champion:null,status:'active',groupMode:$('shuffleMode').value,createdAt:now,updatedAt:now}}
function getPlayer(id){return id&&tournament?tournament.players.find(p=>p.id===id)||null:null}
function real(m){return!!m&&!!m.a&&!!m.b}
function valid(m){return!!m&&!!m.winner&&(m.winner===m.a||m.winner===m.b)}
function activeMatches(round){return(round?.matches||[]).filter(m=>m&&((m.a)||(m.b)))}
function stateSnapshot(){try{const raw=localStorage.getItem(STATE_KEY);return raw?JSON.parse(raw):null}catch{return null}}
function sanitizeState(s){
 if(!s||s.version!==8||!Array.isArray(s.players)||!Array.isArray(s.rounds))return null;
 if(s.players.length<2||s.players.length>MAX_PLAYERS)return null;
 const ids=new Set(),players=[];
 for(const p of s.players){if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||!p.name)return null;const gender=normalizeGender(p.gender);if(!gender)return null;ids.add(p.id);players.push({id:p.id,name:p.name,gender})}
 const size=nextPow2(players.length),expectedRounds=Math.log2(size);
 if(s.rounds.length!==expectedRounds||!Number.isInteger(s.currentRound)||s.currentRound<0||s.currentRound>=expectedRounds)return null;
 const rounds=s.rounds.map((r,ri)=>{if(!r||typeof r.name!=='string'||!Array.isArray(r.matches)||r.matches.length!==size/2**(ri+1))return null;const matches=r.matches.map(m=>{if(!m||typeof m!=='object')return null;const a=typeof m.a==='string'&&ids.has(m.a)?m.a:null,b=typeof m.b==='string'&&ids.has(m.b)?m.b:null,winner=typeof m.winner==='string'&&ids.has(m.winner)&&(m.winner===a||m.winner===b)?m.winner:null;return{a,b,winner,bye:!a||!b}});return{name:r.name,matches}});
 if(rounds.some(r=>!r||r.matches.some(m=>!m)))return null;
 const champion=typeof s.champion==='string'&&ids.has(s.champion)?s.champion:null;
 return{version:8,players,rounds,currentRound:s.currentRound,champion,status:champion?'finished':'active',groupMode:['random','input','mixedGender'].includes(s.groupMode)?s.groupMode:'random',createdAt:Number.isFinite(s.createdAt)?s.createdAt:Date.now(),updatedAt:Number.isFinite(s.updatedAt)?s.updatedAt:Date.now()};
}
function load(){const s=stateSnapshot();return s?sanitizeState(s):null}
function save(force=false){if(!tournament)return false;try{const current=stateSnapshot();if(!force&&current&&Number.isFinite(current.updatedAt)&&current.updatedAt!==lastSavedRevision){const fresh=sanitizeState(current);if(fresh){tournament=fresh;lastSavedRevision=fresh.updatedAt;$('shuffleMode').value=fresh.groupMode;render();showNotice('別のタブで大会が更新されたため、最新状態に同期しました。')}else showNotice('大会データが競合しました。');return false}tournament.updatedAt=Date.now();localStorage.setItem(STATE_KEY,JSON.stringify(tournament));lastSavedRevision=tournament.updatedAt;return true}catch{showNotice('大会結果を保存できませんでした。ブラウザの保存容量を確認してください。');return false}}
function setMode(next){mode=next==='bracket'?'bracket':'cards';$('bracketBtn').classList.toggle('active',mode==='bracket');$('cardsBtn').classList.toggle('active',mode==='cards');$('viewBracket').classList.toggle('active',mode==='bracket');$('viewCards').classList.toggle('active',mode==='cards');if(tournament)render()}
function start(){try{if(tournament&&tournament.status!=='finished'&&!confirm('現在の大会は進行中です。新しい大会を開始すると現在の大会は上書きされます。続けますか？'))return;const players=order(parsePlayers());tournament=makeTournament(players);if(!save(true))return;showTournament()}catch(e){showNotice(e instanceof Error?e.message:'入力を確認してください。')}}
function showTournament(){$('tournamentCard').hidden=false;$('historyCard').hidden=false;showNotice('');render();$('tournamentCard').scrollIntoView({behavior:'smooth',block:'start'})}
function reset(){if(!tournament||!confirm('大会を最初からやり直しますか？現在の大会結果を削除します。'))return;try{localStorage.removeItem(STATE_KEY)}catch{showNotice('大会結果を削除できませんでした。');return}tournament=null;lastSavedRevision=0;$('tournamentCard').hidden=true;$('historyCard').hidden=true;$('tournamentView').innerHTML='';$('history').innerHTML='';$('championArea').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function playerHtml(m,r,i,interactive,compact=false){const a=getPlayer(m.a),b=getPlayer(m.b),label=`${esc(tournament.rounds[r].name)} ・ 試合 ${i+1}`;if(!a&&!b)return`<div class="match"><div class="meta">${label}</div><div class="emptySlot">対戦者待ち</div></div>`;if(!real(m)){const p=a||b;return`<div class="match ${compact?'bracket-match':''}"><div class="meta">${label}</div><div class="bye"><div class="byeName">${esc(p.name)}</div><div class="gender">${esc(p.gender)}</div><div class="byeNote">不戦勝・自動確定</div></div></div>`}const row=(side,p)=>interactive?`<button type="button" class="player ${m.winner===p.id?'selected':''}" data-r="${r}" data-i="${i}" data-side="${side}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">選択中</span>':''}</button>`:`<div class="player ${m.winner===p.id?'selected':''}"><span class="name">${esc(p.name)}</span><span class="gender">${esc(p.gender)}</span>${m.winner===p.id?'<span class="check">勝</span>':''}</div>`;return`<div class="match ${compact?'bracket-match':''}"><div class="meta">${label}</div><div class="players">${row('a',a)}${row('b',b)}</div></div>`}
function renderCards(){const r=tournament.currentRound,round=tournament.rounds[r];return`<div class="grid">${round.matches.map((m,i)=>playerHtml(m,r,i,tournament.status!=='finished')).join('')}</div>`}
function bracketY(firstCount,r,i,height){return((i+0.5)*2**r/firstCount)*height}
function connectorSvg(prev,next,r,firstCount,height,gapWidth){const paths=[];for(let j=0;j<next.matches.length;j++){const target=next.matches[j];if(!target||(target.a==null&&target.b==null))continue;const sources=[prev.matches[2*j],prev.matches[2*j+1]],ys=[];sources.forEach((m,k)=>{if(m&&(m.a||m.b))ys.push(bracketY(firstCount,r,2*j+k,height))});const targetY=bracketY(firstCount,r+1,j,height),mid=gapWidth/2;if(ys.length===2)paths.push(`M0 ${ys[0]} H${mid} M0 ${ys[1]} H${mid} M${mid} ${Math.min(ys[0],ys[1])} V${Math.max(ys[0],ys[1])} M${mid} ${targetY} H${gapWidth}`);else if(ys.length===1)paths.push(`M0 ${ys[0]} H${mid} V${targetY} H${gapWidth}`)}return`<svg viewBox="0 0 ${gapWidth} ${height}" preserveAspectRatio="none" aria-hidden="true">${paths.map(d=>`<path d="${d}"/>`).join('')}</svg>`}
function renderBracket(){const firstCount=tournament.rounds[0]?.matches?.length||1,height=Math.max(460,firstCount*112),end=tournament.status==='finished'?tournament.rounds.length-1:tournament.currentRound,gapWidth=34;let html='<div class="bracket-shell"><div class="bracket-scroll"><div class="bracket-board" style="--bracket-height:'+height+'px">';for(let r=0;r<=end;r++){const round=tournament.rounds[r];if(!round||!activeMatches(round).length)continue;html+=`<div class="bracket-round"><div class="bracket-round-label">${esc(round.name)}</div><div class="bracket-track">`;round.matches.forEach((m,i)=>{if(!m.a&&!m.b)return;const top=(bracketY(firstCount,r,i,height)/height*100).toFixed(4);html+=`<div class="bracket-match-wrap" style="top:${top}%">${playerHtml(m,r,i,false,true)}</div>`});html+='</div></div>';if(r<end){const next=tournament.rounds[r+1];if(next&&activeMatches(next).length)html+=`<div class="bracket-gap" style="--bracket-height:${height}px">${connectorSvg(round,next,r,firstCount,height,gapWidth)}</div>`}}return html+'</div></div></div>'}
function choose(r,i,side){if(!tournament||tournament.status==='finished'||r!==tournament.currentRound)return;const m=tournament.rounds[r]?.matches?.[i];if(!m||!real(m))return;const id=side==='a'?m.a:m.b;m.winner=m.winner===id?null:id;if(save())render()}
function confirmRound(){if(!tournament||tournament.status==='finished')return;const round=tournament.rounds[tournament.currentRound],matches=activeMatches(round);if(!matches.length){showNotice('確定できる試合がありません。');return}if(!matches.every(valid)){showNotice('まだ勝者が未入力の試合があります。勝者を選択してください。');return}const winners=matches.map(m=>m.winner);if(new Set(winners).size!==winners.length){showNotice('同じ参加者が複数試合の勝者になっています。');return}if(winners.length===1){tournament.champion=winners[0];tournament.status='finished';if(save(true))render();return}const next=tournament.rounds[tournament.currentRound+1];if(!next){showNotice('次のラウンドを作成できませんでした。');return}next.matches=next.matches.map((_,i)=>i<Math.ceil(winners.length/2)?match(winners[i*2],winners[i*2+1]||null):match());tournament.currentRound++;if(save(true)){render();$('tournamentCard').scrollIntoView({behavior:'smooth',block:'start'})}}
function render(){if(!tournament)return;const round=tournament.rounds[tournament.currentRound];if(!round){showNotice('大会データが壊れているため表示できません。');return}const matches=activeMatches(round),resolved=matches.filter(valid).length,finished=tournament.status==='finished'&&!!tournament.champion,ready=!finished&&matches.length>0&&resolved===matches.length;$('summary').innerHTML=`<span class="pill">${tournament.players.length}人</span><span class="pill">${finished?'終了':esc(round.name)}</span>`;let body;if(finished)body=`<div class="final-bracket"><h3>最終トーナメント表</h3>${renderBracket()}</div>`;else body=mode==='cards'?renderCards():renderBracket();$('tournamentView').innerHTML=`<div class="round-status"><div><div class="step">${finished?'大会結果':'現在のラウンド'}</div><div class="round-title">${finished?'大会終了':esc(round.name)}</div>${finished?'':`<div class="progress">${resolved} / ${matches.length} 試合の勝者を選択済み</div>`}</div>${finished?'':`<button id="confirmRound" class="confirm" type="button" ${ready?'':'disabled'}>${esc(round.name)}を確定</button>`}</div>${body}`;$('confirmRound')?.addEventListener('click',confirmRound);$('tournamentView').querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.r),Number(b.dataset.i),b.dataset.side)));renderHistory()}
function renderHistory(){$('history').innerHTML=tournament.rounds.map(r=>{const rows=r.matches.filter(m=>m.a||m.b).map(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);const matchup=a?(b?`${esc(a.name)} vs ${esc(b.name)}`:`${esc(a.name)} vs 不戦勝`):`不戦勝 ${esc(b?.name||'')}`;return`<div class="result"><span>${matchup}</span><span>${w?`勝者：${esc(w.name)}`:'未確定'}</span></div>`}).join('');return`<div class="historyRound"><div class="historyTitle">${esc(r.name)}</div>${rows||'<div class="empty">まだ記録なし</div>'}</div>`}).join('');const c=getPlayer(tournament.champion);$('championArea').innerHTML=c?`<div class="champion"><div class="step">大会結果</div><div class="championName">${esc(c.name)}</div><div class="gender">${esc(c.gender)}</div></div>`:''}
async function copyResults(){if(!tournament)return;const out=['じゃんけん大会 対戦結果',''];tournament.rounds.forEach(r=>{out.push(r.name);r.matches.filter(m=>m.a||m.b).forEach(m=>{const a=getPlayer(m.a),b=getPlayer(m.b),w=getPlayer(m.winner);out.push(`・${a?a.name:'不戦勝'}${b?` vs ${b.name}`:''} → ${w?`勝者：${w.name}`:'未確定'}`)});out.push('')});if(tournament.champion){const c=getPlayer(tournament.champion);if(c)out.push(`優勝：${c.name}`)}const text=out.join('\n');try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else throw Error();showNotice('結果をコピーしました。')}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch{}t.remove();showNotice(ok?'結果をコピーしました。':'コピーできませんでした。')}}
window.addEventListener('storage',e=>{if(e.key!==STATE_KEY)return;const fresh=load();if(!fresh){showNotice('大会データが他のタブで変更されました。');return}const rev=fresh.updatedAt||0;if(rev>lastSavedRevision){tournament=fresh;lastSavedRevision=rev;$('shuffleMode').value=fresh.groupMode;$('tournamentCard').hidden=false;$('historyCard').hidden=false;render();showNotice('別のタブで大会が更新されたため、最新状態に同期しました。')}});
$('bracketBtn').addEventListener('click',()=>setMode('bracket'));$('cardsBtn').addEventListener('click',()=>setMode('cards'));$('viewBracket').addEventListener('click',()=>setMode('bracket'));$('viewCards').addEventListener('click',()=>setMode('cards'));$('startBtn').addEventListener('click',start);$('clearBtn').addEventListener('click',()=>{participants.value='';try{localStorage.removeItem(INPUT_KEY)}catch{}showNotice('');participants.focus()});$('resetTournament').addEventListener('click',reset);$('copyBtn').addEventListener('click',copyResults);$('printBtn').addEventListener('click',()=>window.print());participants.addEventListener('input',()=>{try{localStorage.setItem(INPUT_KEY,participants.value)}catch{}});try{participants.value=localStorage.getItem(INPUT_KEY)||''}catch{}tournament=load();if(tournament){lastSavedRevision=tournament.updatedAt||0;$('shuffleMode').value=tournament.groupMode;$('tournamentCard').hidden=false;$('historyCard').hidden=false;render()}
})();
</script>
