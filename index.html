<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>チーム分けツール</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;padding:24px 16px 48px}header{margin-bottom:20px}h1{margin:0;font-size:clamp(28px,5vw,42px);letter-spacing:-.03em}header p{margin:8px 0 0;color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 6px 24px #1118270a}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-weight:700;margin-bottom:8px}textarea{width:100%;min-height:300px;resize:vertical;border:1px solid #d1d5db;border-radius:12px;padding:14px;font:inherit;line-height:1.6;outline:none}textarea:focus,input:focus,select:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}.settings{display:grid;gap:14px;align-content:start}input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font:inherit}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d1d5db;border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:#fff;color:#374151}.seg button.active{background:#111827;color:#fff}.hint{font-size:13px;color:#6b7280;margin:7px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:#111827;color:#fff}button.secondary{background:#e5e7eb;color:#111827}button.danger{background:#fee2e2;color:#991b1b}button:disabled{opacity:.45;cursor:not-allowed}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{padding:7px 10px;border-radius:999px;background:#f3f4f6;font-size:13px;font-weight:700}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.team{border:1px solid #e5e7eb;border-radius:14px;padding:14px;background:#fafafa}.team h3{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between}.team h3 span{font-size:12px;color:#6b7280;font-weight:600}.member{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #e5e7eb}.member:first-of-type{border-top:0}.gender{font-size:12px;padding:3px 7px;border-radius:999px;background:#fff;border:1px solid #e5e7eb;color:#6b7280}.empty{text-align:center;color:#9ca3af;padding:28px}.notice{padding:12px 14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;margin-top:12px;font-size:14px;display:none}.results-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="app">
<header><h1>👥 チーム分けツール</h1><p>名前と性別を入力して、できるだけバランスよくランダムにチームを作成します。</p></header>
<section class="card">
<div class="grid">
<div>
<label for="participants">参加者</label>
<textarea id="participants" placeholder="例：\n田中 / 男子\n佐藤 / 女子\n鈴木 / 男子\n山田 / 女子\n\nまたは「田中 男子」のような入力もOK"></textarea>
<p class="hint">1行につき1人。性別は「男子」「女子」で入力してください。</p>
</div>
<div class="settings">
<div><label for="teamCount">チーム数</label><input id="teamCount" type="number" min="2" max="100" value="4"></div>
<div><label>分け方</label><div class="seg"><button id="balancedBtn" class="active" type="button">男女バランス</button><button id="randomBtn" type="button">完全ランダム</button></div></div>
<div><label for="prefix">チーム名</label><select id="prefix"><option value="alpha">A・B・C…</option><option value="number">1・2・3…</option><option value="japanese">1組・2組…</option></select></div>
<div class="actions"><button id="divideBtn" type="button">チームを作成</button><button id="clearBtn" class="secondary" type="button">入力をクリア</button></div>
<div id="notice" class="notice"></div>
</div>
</div>
</section>
<section class="card" id="resultCard">
<h2>作成結果</h2><div id="summary" class="summary"></div><div id="teams" class="teams"><div class="empty">まだチームが作成されていません。</div></div>
<div class="results-actions"><button id="redrawBtn" class="secondary" type="button" disabled>🔀 もう一度分ける</button><button id="copyBtn" class="secondary" type="button" disabled>📋 結果をコピー</button></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);const participants=$('participants');const teamCount=$('teamCount');const teamsEl=$('teams');const summary=$('summary');const notice=$('notice');let mode='balanced';let lastPlayers=[];
const saved=localStorage.getItem('randomPickerParticipants');if(saved)participants.value=saved;
participants.addEventListener('input',()=>localStorage.setItem('randomPickerParticipants',participants.value));
$('balancedBtn').onclick=()=>{mode='balanced';$('balancedBtn').classList.add('active');$('randomBtn').classList.remove('active')};$('randomBtn').onclick=()=>{mode='random';$('randomBtn').classList.add('active');$('balancedBtn').classList.remove('active')};
$('clearBtn').onclick=()=>{participants.value='';localStorage.removeItem('randomPickerParticipants');participants.focus()};$('divideBtn').onclick=()=>divide(false);$('redrawBtn').onclick=()=>divide(true);$('copyBtn').onclick=copyResults;
function parse(){const lines=participants.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const out=[];const seen=new Set();for(const line of lines){let parts=line.split(/\s*[\/,:、|]\s*/).filter(Boolean);if(parts.length<2)parts=line.split(/\s+/).filter(Boolean);let name='',gender='';if(parts.length>=2){gender=normalizeGender(parts.at(-1));name=parts.slice(0,-1).join(' ')}if(!gender){const m=line.match(/^(.*?)[\s　]+(男子|男|女子|女)$/);if(m){name=m[1].trim();gender=normalizeGender(m[2])}}if(!name||!gender)throw new Error(`入力を確認してください：「${line}」`);if(seen.has(name))throw new Error(`同じ名前が複数あります：「${name}」`);seen.add(name);out.push({name,gender})}return out}
function normalizeGender(g){g=g.trim();if(['男子','男','M','m'].includes(g))return'男子';if(['女子','女','F','f'].includes(g))return'女子';return''}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function divide(isRedraw){try{const players=parse();const n=Math.floor(Number(teamCount.value));if(players.length<2)throw new Error('2人以上の参加者を入力してください。');if(!Number.isInteger(n)||n<2)throw new Error('チーム数は2以上で指定してください。');if(n>players.length)throw new Error('チーム数が参加者数を超えています。');lastPlayers=players;notice.style.display='none';const teams=Array.from({length:n},()=>[]);if(mode==='random'){shuffle(players).forEach((p,i)=>teams[i%n].push(p))}else{const boys=shuffle(players.filter(p=>p.gender==='男子'));const girls=shuffle(players.filter(p=>p.gender==='女子'));const order=shuffle([...Array(n).keys()]);let index=0;while(boys.length||girls.length){let source;if(!boys.length)source=girls;else if(!girls.length)source=boys;else{const boyCounts=teams.map(t=>t.filter(p=>p.gender==='男子').length);const girlCounts=teams.map(t=>t.filter(p=>p.gender==='女子').length);source=(boys.length>=girls.length)?boys:girls;const gender=source===boys?'男子':'女子';const target=order.map(i=>i).sort((a,b)=>teams[a].length-teams[b].length||(gender==='男子'?boyCounts[a]-boyCounts[b]:girlCounts[a]-girlCounts[b]));teams[target[0]].push(source.shift());continue}teams[order[index++%n]].push(source.shift())}}
render(teams);notice.textContent=isRedraw?'再抽選しました。':'チームを作成しました。';notice.style.display='block'}catch(e){notice.textContent=e.message;notice.style.display='block'}}
function teamName(i){const type=$('prefix').value;if(type==='number')return`チーム ${i+1}`;if(type==='japanese')return`${i+1}組`;let s='',x=i+1;while(x){x--;s=String.fromCharCode(65+x%26)+s;x=Math.floor(x/26)}return`チーム ${s}`}
function render(teams){summary.innerHTML=`<span class="pill">参加者 ${lastPlayers.length}人</span><span class="pill">${teams.length}チーム</span><span class="pill">${mode==='balanced'?'男女バランス重視':'完全ランダム'}</span>`;teamsEl.innerHTML=teams.map((t,i)=>`<div class="team"><h3>${teamName(i)}<span>${t.length}人</span></h3>${t.map(p=>`<div class="member"><span>${escapeHtml(p.name)}</span><span class="gender">${p.gender}</span></div>`).join('')}</div>`).join('');$('redrawBtn').disabled=false;$('copyBtn').disabled=false;window.currentTeams=teams}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function copyResults(){if(!window.currentTeams)return;const text=window.currentTeams.map((t,i)=>`${teamName(i)} (${t.length}人)\n${t.map(p=>`・${p.name}（${p.gender}）`).join('\n')}`).join('\n\n');navigator.clipboard.writeText(text).then(()=>{notice.textContent='結果をコピーしました。';notice.style.display='block'}).catch(()=>{notice.textContent='コピーできませんでした。';notice.style.display='block'})}
$('prefix').onchange=()=>{if(window.currentTeams)render(window.currentTeams)};
</script>
</body>
</html>
